<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Xe Mazda — Bản đồ + Video</title>

<!-- MapLibre (bản đồ 3D) — chạy local để không bị ad blocker chặn CDN -->
<link rel="stylesheet" href="maplibre-gl.css" />
<script src="maplibre-gl.js"></script>
<!-- dash.js để phát video DASH không quảng cáo -->
<script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>

<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #2a313a;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #ff4d4d;
    --accent-green: #2ea043;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- Bố cục chia đôi ---------- */
  #app { display: flex; height: 100vh; width: 100vw; }

  /* ===== TRÁI: BẢN ĐỒ ===== */
  #map-pane { position: relative; flex: 1 1 50%; min-width: 0; border-right: 2px solid var(--border); }
  #map { position: absolute; inset: 0; background: #242f3e; }
  /* Lớp video chứa bản đồ, xem phần "Vẽ qua lớp video" trong script */
  #map-video { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; object-fit: fill; pointer-events: none; }
  #map-pane:not(.mirror) #map-video { visibility: hidden; }
  #map-pane.mirror #nav-arrow,
  #map-pane.mirror #speed-overlay,
  #map-pane.mirror #speed-glow,
  #map-pane.mirror #cam-warning,
  #map-pane.mirror #gps-status { visibility: hidden; }
  #nav-arrow { width: 52px; height: 52px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.55)); }
  #map .maplibregl-ctrl-group { background: rgba(23,32,44,0.92); border: 1px solid var(--border); box-shadow: none; }
  #map .maplibregl-ctrl-group button + button { border-top-color: var(--border); }
  #map .maplibregl-ctrl-group .maplibregl-ctrl-icon { filter: invert(1); }
  #map .maplibregl-ctrl-attrib { font-size: 10px; background: rgba(14,17,22,0.7); color: var(--muted); }
  #map .maplibregl-ctrl-attrib a { color: var(--muted); }

  /* Nút chuông và phóng to nằm cùng cột với nút + − của bản đồ (gắn vào bằng addControl).
     Thiết bị không có WebGL thì không có bản đồ, nút vẫn nằm ở góc này */
  #map-pane > #map-tools { position: absolute; z-index: 1000; right: 10px; bottom: 30px; }
  #map .maplibregl-ctrl-group button.map-btn, #map-pane > #map-tools .map-btn {
    display: block; width: 29px; height: 29px; padding: 0;
    color: var(--text); font-size: 15px; line-height: 29px; text-align: center; cursor: pointer;
  }
  #map .maplibregl-ctrl-group button#btn-sound.active { background: var(--accent-green); color: #fff; }

  /* Nút tìm kiếm và menu ở góc dưới bên trái */
  #map-side { position: absolute; z-index: 1000; left: 10px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  .side-btn {
    width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center;
    background: #fff; color: #222; border: none; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.45); cursor: pointer;
  }
  .side-btn svg { width: 20px; height: 20px; }

  /* Màn hình tìm địa điểm, phủ phần bản đồ. Ô nhập phải từ 26px, nhỏ hơn thì iPhone tự phóng to trên xe */
  #place-search {
    position: absolute; z-index: 1100; inset: 0; display: flex; flex-direction: column;
    background: var(--panel); color: var(--text);
  }
  #place-search.hidden { display: none; }
  #place-search-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; flex: none; }
  #place-back { flex: none; width: 40px; height: 44px; background: none; border: none; color: var(--text); font-size: 26px; cursor: pointer; }
  #place-input {
    flex: 1; min-width: 0; box-sizing: border-box; height: 44px; padding: 0 12px;
    background: var(--bg); color: var(--text); border: 1.5px solid #2fe0e6; border-radius: 10px; outline: none; font-size: 26px;
  }
  #place-shortcuts { display: flex; gap: 4px; padding: 0 8px 4px; flex: none; overflow-x: auto; scrollbar-width: none; }
  #place-shortcuts::-webkit-scrollbar { display: none; }
  #place-shortcuts.hidden { display: none; }
  .place-shortcut { flex: none; width: 66px; padding: 2px 0; background: none; border: none; color: var(--text); cursor: pointer; }
  .place-shortcut i { display: block; width: 38px; height: 38px; margin: 0 auto 2px; line-height: 38px; font-style: normal; font-size: 21px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  .place-shortcut span { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #place-list-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 12px; flex: none; font-weight: 700; font-size: 15px; }
  #place-list-head.hidden { display: none; }
  #place-clear { background: none; border: none; color: var(--muted); font-size: 14px; padding: 6px 0; cursor: pointer; }
  #place-clear.hidden { display: none; }
  #place-list { flex: 1; min-height: 0; overflow-y: auto; }
  .place-row { display: flex; align-items: center; padding-left: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .place-row > svg { flex: none; width: 20px; height: 20px; margin-right: 8px; color: var(--muted); }
  .place-item {
    flex: 1; min-width: 0; padding: 7px 0; text-align: left; cursor: pointer;
    background: none; border: none; color: var(--text);
  }
  .place-more { flex: none; width: 44px; height: 44px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .place-actions { flex: 0 0 100%; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px 0; }
  .place-actions button { padding: 7px 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; cursor: pointer; }
  .place-actions button.on { border-color: #2fe0e6; color: #2fe0e6; }
  .place-item b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .place-item span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #place-message { padding: 20px 12px; text-align: center; color: var(--muted); font-size: 15px; }

  /* Chi tiết địa điểm sau khi chọn kết quả tìm kiếm */
  #place-detail {
    position: absolute; z-index: 1100; left: 0; right: 0; bottom: 0; padding: 8px 12px 10px;
    background: var(--panel); color: var(--text); border-radius: 14px 14px 0 0; box-shadow: 0 -3px 10px rgba(0,0,0,0.45);
  }
  #place-detail.hidden { display: none; }
  #place-detail-name { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #place-detail-info { font-size: 13px; color: var(--muted); margin: 2px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #place-detail-actions { display: flex; gap: 8px; }
  #place-detail-actions button { height: 40px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  #place-route { flex: 1; background: #12c2e9; color: #06222b; border: none; }
  #place-start { flex: 1; background: none; color: #2fe0e6; border: 1.5px solid #2fe0e6; }
  #place-like { flex: none; width: 44px; background: var(--bg); color: var(--text); border: 1px solid var(--border); font-size: 18px; }
  .detail-top { position: absolute; z-index: 1100; top: 10px; width: 36px; height: 36px; padding: 0; background: #fff; color: #222; border: none; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.45); font-size: 20px; cursor: pointer; }
  .detail-top.hidden { display: none; }
  #place-detail-back { left: 10px; font-size: 26px; line-height: 30px; }
  #place-detail-close { right: 10px; }
  /* Lúc xem chi tiết chỉ để lại bản đồ và phần trên */
  #map-pane.place-detail #speed-overlay, #map-pane.place-detail #cross-road, #map-pane.place-detail #junction,
  #map-pane.place-detail #cam-warning, #map-pane.place-detail #map-side, #map-pane.place-detail #gps-status,
  #map-pane.place-detail #speed-glow, #map-pane.place-detail .maplibregl-ctrl-bottom-right { display: none; }

  /* Lúc đang dẫn đường: khung rẽ rộng tới sát bảng tốc độ, thanh giờ tới ở dưới */
  #map-pane.nav #cross-road { width: calc(100% - 140px); height: 52px; }
  #map-pane.nav #cross-road > div { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; }
  #map-pane.nav #cross-road-dist { flex: none; font-size: 22px; }
  #map-pane.nav #cross-road-name { font-size: 16px; max-width: none; min-width: 0; }
  /* Đang dẫn đường chỉ giữ nút về xe, đặt trên thanh giờ tới */
  #map-pane.nav #map-side { bottom: 60px; }
  #map-pane.nav #btn-search, #map-pane.nav #btn-menu { display: none; }
  #map-pane.nav #gps-status { bottom: 58px; }
  #nav-bar {
    position: absolute; z-index: 1000; left: 10px; right: 52px; bottom: 16px; height: 36px; box-sizing: border-box;
    display: flex; align-items: center; padding: 0 2px 0 12px; background: #0a0a0c; color: #fff; border-radius: 10px;
  }
  #nav-bar.hidden { display: none; }
  /* Lớp video đã vẽ thanh này, chỉ giữ nút ✕ trong suốt nằm trên để bấm */
  #map-pane.mirror #nav-bar { background: transparent; }
  #map-pane.mirror #nav-bar-text { visibility: hidden; }
  #map-pane.mirror #nav-stop { color: transparent; }
  #nav-bar-text { flex: 1; min-width: 0; text-align: center; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nav-stop { flex: none; width: 34px; height: 34px; background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; }

  /* Tên đường đang chạy, nằm giữa phía dưới như app dẫn đường */
  #gps-status {
    position: absolute; z-index: 1000; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: #0a0a0c; border: 1px solid #0a0a0c;
    border-radius: 16px; padding: 4px 14px; font-size: 15px; font-weight: 600; color: #2fe0e6;
    max-width: 62%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Bảng tốc độ nổi trên bản đồ. Đặt bên phải vì trên CarPlay mép trái trang có thể bị thanh ứng dụng che */
  #speed-overlay {
    position: absolute; z-index: 1000; top: 10px; right: 10px;
    display: flex; gap: 6px;
  }
  .speed-card {
    width: 52px; height: 52px; text-align: center;
    display: flex; align-items: center; justify-content: center;
  }
  .speed-card .value { box-sizing: border-box; width: 52px; height: 52px; border-radius: 50%; font-weight: 800; }

  /* Biển giới hạn tốc độ: nền kem, viền đỏ dày */
  #speed-limit-box .value {
    line-height: 42px; border: 5px solid #e11d2e;
    background: #fff8e7; color: #3f3f46; font-size: 20px;
  }
  #speed-limit-box.unknown .value { color: #999; font-size: 16px; }
  #speed-limit-box.estimated .value { color: #777; border-color: #999; font-size: 15px; }

  /* Tốc độ hiện tại: nền xanh đậm, viền xanh sáng */
  #current-speed-box .value {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 4px solid #1e88ff; background: #12233f; color: #fff; font-size: 21px; line-height: 1;
  }
  #current-speed-box .value::after { content: 'km/h'; font-size: 9px; font-weight: 700; color: #fff; margin-top: 1px; }
  #current-speed-box.over .value { color: #ff4d4d; border-color: #ff2b2b; }

  @keyframes blink { 50% { opacity: 0.35; } }

  /* Viền đỏ quanh bản đồ khi quá tốc độ */
  #speed-glow {
    position: absolute; z-index: 999; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 5px #ff1f1f, inset 0 0 38px 18px rgba(255, 20, 20, 0.9);
    animation: speed-glow 1s ease-in-out infinite;
  }
  #speed-glow.hidden { display: none; }

  /* Đường sắp cắt qua, góc trên bên trái */
  #cross-road {
    position: absolute; z-index: 1000; top: 10px; left: 10px; width: 176px; height: 56px; box-sizing: border-box;
    display: flex; align-items: center; gap: 8px; padding: 4px 8px;
    background: rgba(14,17,22,0.92); border-radius: 10px; color: #fff;
  }
  #cross-road.hidden { display: none; }
  #map-pane.mirror #cross-road { visibility: hidden; }
  #cross-road svg { flex: none; width: 26px; height: 40px; }
  #cross-road-dist { font-size: 19px; font-weight: 800; line-height: 1.1; }
  #cross-road-name { font-size: 13px; line-height: 1.15; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 126px; }

  /* Các hướng đi ở ngã phía trước, ngay dưới tên đường sắp cắt qua */
  #junction { position: absolute; z-index: 1000; top: 70px; left: 10px; display: block; height: 40px; }
  #junction.hidden { display: none; }
  #map-pane.mirror #junction { visibility: hidden; }
  @keyframes speed-glow { 50% { opacity: 0.4; } }

  /* Cảnh báo sắp tới camera */
  #cam-warning {
    position: absolute; z-index: 1001; top: 68px; left: 60%; white-space: nowrap;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: #f59e0b; color: #111; font-weight: 800; font-size: 18px;
    padding: 3px 12px 3px 3px; border-radius: 10px;
    animation: blink 0.6s steps(2, start) infinite;
  }
  #cam-warning.hidden { display: none; }
  #cam-warning-icon { width: 32px; height: 32px; }

  /* ===== PHẢI: NHẠC ===== */
  #music-pane {
    position: relative;
    flex: 1 1 50%; min-width: 0;
    display: flex; flex-direction: column; background: var(--panel);
  }
  #music-pane .head {
    padding: 6px 8px; border-bottom: 1px solid var(--border);
    font-size: 20px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .expand-btn {
    flex: 0 0 auto; font-size: 14px; padding: 8px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap;
  }

  .search-bar { position: relative; display: flex; gap: 6px; padding: 6px 8px; }
  /* iPhone trên xe hiển thị trang ở mức 70% và tự phóng to nếu chữ trong ô nhập dưới khoảng 23px.
     Nên giữ cỡ chữ 26px rồi thu nhỏ cả ô bằng transform, nhìn như chữ 17px. */
  .search-field { flex: 1; min-width: 0; height: 36px; }
  #search-input {
    display: block; width: 153.85%; height: 153.85%;
    transform: scale(0.65); transform-origin: 0 0;
    font-size: 26px; padding: 2px 15px;
    background: var(--bg); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 15px; outline: none;
  }
  #search-btn {
    font-size: 16px; padding: 8px 14px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-weight: 700; cursor: pointer;
  }
  #search-history {
    position: absolute; z-index: 20; top: 100%; left: 8px; right: 8px;
    display: none; max-height: 190px; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  }
  #search-history.show { display: block; }
  #search-history button {
    display: block; width: 100%; padding: 9px 12px; cursor: pointer; text-align: left;
    font-size: 15px; color: var(--text); background: none; border: none;
    border-bottom: 1px solid var(--border);
  }

  #now-playing { position: relative; display: none; }
  #now-playing.show { display: block; }
  /* Tên bài chỉ hiện nhỏ trên video khi rê chuột hoặc chạm vào */
  .np-card {
    position: absolute; z-index: 2; top: 4px; left: 12px; right: 12px;
    display: flex; gap: 8px; align-items: center;
    background: rgba(14,17,22,0.85); border-radius: 8px; padding: 3px 6px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #now-playing.info .np-card { opacity: 1; pointer-events: auto; }
  .np-card img { width: 26px; height: 26px; border-radius: 4px; object-fit: cover; background: #222; }
  .np-info { flex: 1; min-width: 0; }
  .np-info .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-info .a { display: none; }
  .np-card .fav { font-size: 20px; padding: 2px 4px; }
  #video { display: block; width: 100%; border-radius: 10px; background: #000; }

  /* Đang xem video: video chiếm hết chỗ, danh sách ẩn */
  #app.video-view #result-tabs,
  #app.video-view #results { display: none; }
  #app.video-view #now-playing.show { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 8px 8px; }
  #app.video-view #video { flex: 1; min-height: 0; }

  /* Đang xem danh sách: video thu nhỏ ở góc, chạm vào để quay lại */
  #app.list-view #now-playing.show {
    position: absolute; z-index: 5; right: 20px; bottom: 8px; width: 150px; cursor: pointer;
    border: 2px solid var(--accent); border-radius: 12px;
  }
  #app.list-view #video { pointer-events: none; aspect-ratio: 16 / 9; }
  #app.list-view .np-card { display: none; }
  #app.list-view #results { padding-bottom: 100px; }

  #results {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px 20px;
    scrollbar-color: #6a6e7c transparent;
  }
  #results::-webkit-scrollbar { width: 12px; }
  #results::-webkit-scrollbar-thumb { background: #6a6e7c; border-radius: 6px; }
  .song {
    display: flex; gap: 10px; align-items: center; padding: 5px;
    border-radius: 10px; cursor: pointer; border: 1px solid transparent;
  }
  .song:hover, .song.playing { background: var(--bg); border-color: var(--accent); }
  .song img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: #222; flex: 0 0 44px; }
  .song .meta { flex: 1; min-width: 0; }
  .song .t { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .a { font-size: 13px; color: var(--muted); }
  .song .d { font-size: 13px; color: var(--muted); flex: 0 0 auto; }

  .hint { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 16px; }
  .err { color: #ff9a9a; text-align: center; padding: 20px; font-size: 15px; }

  .head-buttons { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .fav {
    flex: 0 0 auto; background: none; border: none; cursor: pointer;
    color: #f5c518; font-size: 26px; line-height: 1; padding: 6px 8px;
  }

  #result-tabs { display: flex; gap: 6px; padding: 2px 8px 0; }
  #result-tabs button {
    flex: 1; font-size: 14px; padding: 7px 4px; cursor: pointer;
    background: var(--bg); color: var(--muted);
    border: 1px solid var(--border); border-radius: 8px;
  }
  #result-tabs button.active { color: var(--text); border-color: var(--accent); }
  #result-tabs .scroll-btn { flex: 0 0 44px; color: var(--text); }

  .drive-buttons { display: flex; flex: 0 0 auto; gap: 8px; }
  .drive-buttons button {
    width: 48px; height: 40px; font-size: 20px; cursor: pointer;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
  }

  /* Chế độ phóng to */
  #app.focus-map #music-pane { display: none; }
  #app.video-focus #music-pane .search-bar,
  #app.video-focus #music-pane #results,
  #app.video-focus #result-tabs,
  #app.video-focus .np-card { display: none; }
  #app.video-focus #now-playing.show { flex: 1; display: flex; flex-direction: column; padding: 8px; }
  #app.video-focus #video { flex: 1; max-height: none; }

  /* Dọc (điện thoại test): xếp chồng */
  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #map-pane { flex: 1 1 55%; border-right: none; border-bottom: 2px solid var(--border); }
    #music-pane { flex: 1 1 45%; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ================= TRÁI: BẢN ĐỒ ================= -->
  <section id="map-pane">
    <div id="map"></div>

    <div id="speed-glow" class="hidden"></div>

    <div id="cross-road" class="hidden">
      <svg viewBox="0 0 26 40"><path d="M13 1 L25 17 H17 V39 H9 V17 H1 Z" fill="#4d9bff"/></svg>
      <div>
        <div id="cross-road-dist"></div>

// Kéo bản đồ để xem chỗ khác thì tạm thôi bám theo, một lúc sau tự quay về xe.
// Hẹn giờ ngay từ lúc bắt đầu kéo, vì trên xe có thể không nhận được lúc thả tay.
let followTimer = null;

/* ---------- GPS ---------- */
function setStatus(msg) { document.getElementById('gps-status').textContent = msg; }

let gpsWatchId = null;
let gpsHeardAt = 0;         // lần cuối nhận được vị trí
let gpsAskedAt = 0;         // lần cuối yêu cầu GPS
let gpsRestarts = 0;

function startGPS() {
  if (!('geolocation' in navigator)) {
    setStatus('⚠️ Trình duyệt không hỗ trợ GPS — chạm vào bản đồ để đặt vị trí');
    return;
  }
  if (!gpsHeardAt) setStatus('Đang tìm GPS… (cần mở trang qua HTTPS)');   // đã có vị trí thì giữ nguyên tên đường
  gpsAskedAt = Date.now();
  gpsWatchId = navigator.geolocation.watchPosition(onPosition, onGPSError, {
    enableHighAccuracy: true, maximumAge: 2000, timeout: 15000
  });
}

// iPhone ngừng cấp vị trí cho trang web khi màn hình tắt, trang không tự lấy được.
// Khi màn hình sáng lại, hoặc GPS im lặng quá lâu, thì yêu cầu lại để bản đồ chạy tiếp ngay.
function restartGPS() {
  if (gpsWatchId != null) navigator.geolocation.clearWatch(gpsWatchId);
  gpsRestarts++;
  startGPS();
}
setInterval(function () {
  if (document.visibilityState !== 'visible' || !('geolocation' in navigator)) return;
  const now = Date.now();
  if (now - Math.max(gpsHeardAt, gpsAskedAt) > GPS_RESTART_MS) restartGPS();
}, 5000);

// Xin giữ màn hình luôn sáng để iPhone không tự khóa khi đang chạy xe
let wakeLock = null;
let wakeState = 'chua xin';
async function keepScreenOn() {
  if (wakeLock || document.visibilityState !== 'visible') return;
  if (!('wakeLock' in navigator)) { wakeState = 'khong ho tro'; return; }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeState = 'dang giu';
    wakeLock.addEventListener('release', function () { wakeLock = null; wakeState = 'da nha'; });
  } catch (e) {
    wakeState = 'bi tu choi';
  }
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  keepScreenOn();
  if (Date.now() - gpsHeardAt > GPS_RESTART_MS) restartGPS();
});
// iPhone thường chỉ cho giữ màn hình sau khi người dùng chạm vào trang
document.addEventListener('pointerdown', keepScreenOn);

// Khoảng cách (m) giữa hai điểm, đủ chính xác cho quãng ngắn
function distanceM(lat1, lon1, lat2, lon2) {
  const dy = (lat2 - lat1) * 111320;
  const dx = (lon2 - lon1) * 111320 * Math.cos(lat1 * Math.PI / 180);
  return Math.hypot(dx, dy);
}
function bearingDeg(lat1, lon1, lat2, lon2) {
  const dy = lat2 - lat1;
  const dx = (lon2 - lon1) * Math.cos(lat1 * Math.PI / 180);
  return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
}

// Máy không báo tốc độ / hướng thì tự tính từ hai vị trí liên tiếp
let lastFix = null;
let lastHeading = null;
let headingFix = null;      // điểm mốc để tự tính hướng
let gpsCount = 0;           // các số dưới đây chỉ để xem trong chế độ ?debug
let gpsNoHeading = 0;
let gpsGapS = 0;
let gpsLastAt = 0;
let gpsForcedDraws = 0;
let glLost = 0;
function readMotion(pos) {
  const c = pos.coords;
  // Có máy báo số âm thay cho "không biết"
  let kmh = (c.speed != null && c.speed >= 0) ? c.speed * 3.6 : null;
  let heading = (c.heading != null && c.heading >= 0) ? c.heading : null;
  gpsCount++;
  if (heading == null) gpsNoHeading++;
  gpsGapS = gpsLastAt ? (pos.timestamp - gpsLastAt) / 1000 : 0;
  gpsLastAt = pos.timestamp;
  if (lastFix) {
    const dt = (pos.timestamp - lastFix.time) / 1000;
    const dist = distanceM(lastFix.lat, lastFix.lon, c.latitude, c.longitude);
    if (kmh == null && dt >= 1 && c.accuracy <= 30) kmh = (dist < 5) ? 0 : dist / dt * 3.6;
  }
  if (!headingFix) headingFix = { lat: c.latitude, lon: c.longitude };
  if (c.accuracy <= 30 && distanceM(headingFix.lat, headingFix.lon, c.latitude, c.longitude) >= HEADING_MIN_M) {
    if (heading == null) heading = bearingDeg(headingFix.lat, headingFix.lon, c.latitude, c.longitude);
    headingFix = { lat: c.latitude, lon: c.longitude };
  }
  if (!lastFix || distanceM(lastFix.lat, lastFix.lon, c.latitude, c.longitude) >= 5 || pos.timestamp - lastFix.time > 5000) {
    lastFix = { lat: c.latitude, lon: c.longitude, time: pos.timestamp };
  }
  if (heading != null && !(kmh != null && kmh < HEADING_MIN_KMH)) lastHeading = heading;
  return { kmh, heading: lastHeading };
}

// Độ lệch ngắn nhất từ hướng a sang hướng b, từ -180 đến 180
function angleDelta(a, b) {
  return ((b - a + 540) % 360) - 180;
}
// GPS luôn nhiễu vài mét. Đi theo từng điểm thì bản đồ lắc, nên bám mũi tên vào mặt đường
// và lấy hướng của đường khi khớp được, rồi xoay từ từ về hướng đó.
let steadyAt = 0;
function steadyPosition(lat, lon, heading, kmh) {
  if (carPos && kmh != null && kmh < HEADING_MIN_KMH && distanceM(carPos.lat, carPos.lon, lat, lon) < STOP_HOLD_M) {
    return carPos;
  }
  let target = heading;
  let outLat = lat, outLon = lon;
  const m = lastMatch;
  if (m && heading != null && m.dist <= SNAP_ROAD_M && Math.abs(angleDelta(m.bearing, heading)) <= SNAP_ANGLE) {
    target = m.bearing;
    outLat = m.lat;
    outLon = m.lon;
  }
  let smooth = target;
  if (carPos && carPos.heading != null && target != null) {
    const delta = angleDelta(carPos.heading, target);
    smooth = Math.abs(delta) < BEARING_IGNORE ? carPos.heading : (carPos.heading + delta * BEARING_SMOOTH + 360) % 360;
  }
  // Dự đoán vị trí theo tốc độ và hướng, để xe tiến đều chứ không lúc nhanh lúc chậm theo nhiễu GPS
  const now = Date.now();
  const dt = (now - steadyAt) / 1000;
  steadyAt = now;
  const turning = carPos && carPos.heading != null && target != null &&
    Math.abs(angleDelta(carPos.heading, target)) > PREDICT_MAX_TURN;
  if (carPos && carPos.heading != null && !turning && kmh != null && kmh >= HEADING_MIN_KMH && dt <= NAV_MOVE_MAX_MS / 1000) {
    const step = kmh / 3.6 * dt / 111320;
    const rad = carPos.heading * Math.PI / 180;
    const pLat = carPos.lat + Math.cos(rad) * step;
    const pLon = carPos.lon + Math.sin(rad) * step / Math.cos(carPos.lat * Math.PI / 180);
    if (distanceM(pLat, pLon, outLat, outLon) <= PREDICT_MAX_M) {
      outLat = pLat + (outLat - pLat) * POSITION_SMOOTH;
      outLon = pLon + (outLon - pLon) * POSITION_SMOOTH;
    }
  }
  return { lat: outLat, lon: outLon, heading: smooth };
}

function onPosition(pos) {
  gpsHeardAt = Date.now();
  if (!map) return;
  const lat = pos.coords.latitude, lon = pos.coords.longitude;
  const { kmh, heading } = readMotion(pos);

  setStatus('GPS: ' + lat.toFixed(5) + ', ' + lon.toFixed(5));
  lookupSpeedLimit(lat, lon, heading);    // tìm đường trước để biết đặt mũi tên vào đâu

  const next = steadyPosition(lat, lon, heading, kmh);
  const moved = !carPos || distanceM(carPos.lat, carPos.lon, next.lat, next.lon) >= 1 || carPos.heading !== next.heading;
  carPos = next;
  if (!navArrow) navArrow = createNavArrow();
  if (follow) {
    if (moved || !frameSeen) moveCamera(false);     // đứng yên thì không vẽ lại, đỡ nặng máy
  } else {
    placeArrow(next.lon, next.lat, next.heading || 0);
  }

  renderCurrentSpeed(kmh);
}

function createNavArrow() {
  const el = document.createElement('div');
  el.id = 'nav-arrow';
  el.innerHTML = '<svg viewBox="0 0 44 44" width="52" height="52">' +
    '<path d="M22 4 L38 38 L22 30 L6 38 Z" fill="#1a73e8" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/></svg>';
  return new maplibregl.Marker({ element: el, rotationAlignment: 'map', pitchAlignment: 'map' })
    .setLngLat([carPos.lon, carPos.lat]).addTo(map);
}
function placeArrow(lon, lat, rotation) {
  navArrow.setLngLat([lon, lat]).setRotation(rotation);
}

// Đưa camera về sau xe: nghiêng, xoay theo hướng chạy, xe nằm phía dưới màn hình
// iPhone có thể ngừng vẽ khung hình (requestAnimationFrame) trong khi GPS và video vẫn chạy,
// ví dụ khi màn hình điện thoại tắt. Bản đồ trượt nhờ các khung hình đó nên sẽ đứng im.
// Từ lần GPS trước mà chưa có khung hình nào thì nhảy thẳng tới vị trí mới và tự vẽ.
let frameSeen = true;
let lastCameraAt = 0;
function moveCamera(instant) {
  if (!map || !follow || !carPos) return;
  const now = Date.now();
  const gap = Math.max(NAV_MOVE_MIN_MS, Math.min(NAV_MOVE_MAX_MS, now - lastCameraAt));
  lastCameraAt = now;
  const camera = {
    center: [carPos.lon, carPos.lat],
    pitch: NAV_PITCH,
    padding: { top: map.getContainer().clientHeight * NAV_TOP_PADDING, bottom: 0, left: 0, right: 0 },
    duration: instant ? 0 : gap,
    easing: function (t) { return t; },
    essential: true
  };
  if (carPos.heading != null) camera.bearing = carPos.heading;
  if (map.getZoom() < NAV_MIN_ZOOM) {
    camera.zoom = NAV_ZOOM;
    camera.duration = 0;
  }
  const framesRunning = frameSeen;
  frameSeen = false;
  requestAnimationFrame(function () { frameSeen = true; });
  if (framesRunning) {
    glide = null;
    map.easeTo(camera);
  } else {
    gpsForcedDraws++;
    startGlide(camera, gap);
  }
}

// Không có khung hình thì bản đồ không tự trượt được, nên tự chia nhỏ quãng đường theo đồng hồ
let glide = null;
function startGlide(camera, duration) {
  const c = map.getCenter();
  const bearing = map.getBearing();
  const setup = { pitch: camera.pitch, padding: camera.padding };
  if (camera.zoom != null) setup.zoom = camera.zoom;
  map.jumpTo(setup);
  glide = {
    fromLat: c.lat, fromLon: c.lng, fromBearing: bearing,
    toLat: camera.center[1], toLon: camera.center[0],
    turn: camera.bearing == null ? 0 : angleDelta(bearing, camera.bearing),
    start: Date.now(), duration: Math.max(duration, GLIDE_FRAME_MS)
  };
  stepGlide();
}
function stepGlide() {
  if (!glide) return;
  if (!follow) { glide = null; return; }
  const t = Math.min(1, (Date.now() - glide.start) / glide.duration);
  map.jumpTo({
    center: [glide.fromLon + (glide.toLon - glide.fromLon) * t, glide.fromLat + (glide.toLat - glide.fromLat) * t],
    bearing: glide.fromBearing + glide.turn * t
  });
  map.redraw();
  if (t >= 1) glide = null;
}
setInterval(stepGlide, GLIDE_FRAME_MS);
// Khung bản đồ đổi kích thước thì cập nhật ngay, nếu không mũi tên sẽ lệch khỏi giữa
if (map) new ResizeObserver(function () {
  map.resize();
  moveCamera(true);
}).observe(map.getContainer());

if (map) map.on('webglcontextlost', function () { glLost++; });

/* ---------- Vẽ qua lớp video ----------
   Khi khóa iPhone, trang và GPS vẫn chạy nhưng chữ và bản đồ thường không được cập nhật lên màn hình xe,
   chỉ video còn chạy (đã đo trên xe). Vì vậy chép bản đồ, mũi tên và các ô sang một canvas rồi phát thành video. */
let mirrorCanvas = null;
let mirrorCtx = null;
let mirrorTrack = null;
let mirrorVideo = null;
let mirrorAt = 0;

function drawMirrorArrow(ctx) {
  if (!navArrow) return;
  const p = map.project(navArrow.getLngLat());
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(1, Math.cos(map.getPitch() * Math.PI / 180));
  ctx.rotate((navArrow.getRotation() - map.getBearing()) * Math.PI / 180);
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;
  ctx.beginPath();
  ctx.moveTo(0, -21);
  ctx.lineTo(19, 19);
  ctx.lineTo(0, 9.5);
  ctx.lineTo(-19, 19);
  ctx.closePath();
  ctx.fillStyle = '#1a73e8';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff';
  ctx.stroke();
  ctx.restore();
}
// Viền đỏ khi quá tốc độ, cùng nhịp với #speed-glow: sáng rõ rồi mờ đi trong 1 giây
function drawMirrorSpeedGlow(ctx, width, height) {
  const DEPTH = 45;
  ctx.globalAlpha = 0.7 + 0.3 * Math.cos(Date.now() / 1000 * 2 * Math.PI);
  const sides = [
    [0, 0, 0, DEPTH, 0, 0, width, DEPTH],
    [0, height, 0, height - DEPTH, 0, height - DEPTH, width, DEPTH],
    [0, 0, DEPTH, 0, 0, 0, DEPTH, height],
    [width, 0, width - DEPTH, 0, width - DEPTH, 0, DEPTH, height]
  ];
  for (const [x0, y0, x1, y1, x, y, w, h] of sides) {
    const fade = ctx.createLinearGradient(x0, y0, x1, y1);
    fade.addColorStop(0, 'rgba(255, 20, 20, 0.9)');
    fade.addColorStop(1, 'rgba(255, 20, 20, 0)');
    ctx.fillStyle = fade;
    ctx.fillRect(x, y, w, h);
  }
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#ff1f1f';
  ctx.strokeRect(2.5, 2.5, width - 5, height - 5);
  ctx.globalAlpha = 1;
}
function drawMirrorOverlay(ctx, width, height) {
  const pane = document.getElementById('map-pane');
  if (pane.classList.contains('place-detail')) return;   // đang xem chi tiết địa điểm, chỉ cần bản đồ
  const navMode = pane.classList.contains('nav');
  if (!document.getElementById('speed-glow').classList.contains('hidden')) drawMirrorSpeedGlow(ctx, width, height);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Biển giới hạn, cùng vị trí với #speed-overlay
  const limitBox = document.getElementById('speed-limit-box');
  const speedBox = document.getElementById('current-speed-box');
  const speedX = width - 10 - 52, limitX = speedX - 58, top = 10;
  const estimated = limitBox.classList.contains('estimated');
  const unknown = limitBox.classList.contains('unknown');
  ctx.beginPath();
  ctx.arc(limitX + 26, top + 26, 23.5, 0, Math.PI * 2);
  ctx.fillStyle = '#fff8e7';
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = estimated ? '#999' : '#e11d2e';
  ctx.stroke();
  ctx.fillStyle = estimated ? '#777' : (unknown ? '#999' : '#3f3f46');
  ctx.font = '800 ' + (estimated ? 15 : (unknown ? 16 : 20)) + 'px Arial, sans-serif';
  ctx.fillText(document.getElementById('speed-limit').textContent, limitX + 26, top + 27);
  // Tốc độ
  const over = speedBox.classList.contains('over');
  ctx.beginPath();
  ctx.arc(speedX + 26, top + 26, 24, 0, Math.PI * 2);
  ctx.fillStyle = '#12233f';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = over ? '#ff2b2b' : '#1e88ff';
  ctx.stroke();
  ctx.fillStyle = over ? '#ff4d4d' : '#fff';
  ctx.font = '800 21px Arial, sans-serif';
  ctx.fillText(document.getElementById('current-speed').textContent, speedX + 26, top + 22);
  ctx.fillStyle = '#fff';
  ctx.font = '700 9px Arial, sans-serif';
  ctx.fillText('km/h', speedX + 26, top + 38);
  // Đường sắp cắt qua, cùng vị trí với #cross-road
  if (!document.getElementById('cross-road').classList.contains('hidden')) {
    ctx.beginPath();
    ctx.roundRect(10, 10, navMode ? width - 140 : 176, navMode ? 52 : 56, 10);
    ctx.fillStyle = 'rgba(14,17,22,0.92)';
    ctx.fill();
    // Mũi tên xoay theo hướng rẽ khi đang dẫn đường, góc lưu ở #cross-road
    ctx.save();
    ctx.translate(31, navMode ? 36 : 38);
    const crossAngle = Number(document.getElementById('cross-road').dataset.angle || 0);
    ctx.rotate(crossAngle * Math.PI / 180);
    if (crossAngle) ctx.scale(0.85, 0.85);
    ctx.fillStyle = '#4d9bff';
    ctx.fill(new Path2D('M0 -20 L12 -4 H4 V18 H-4 V-4 H-12 Z'));
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = '800 ' + (navMode ? 22 : 19) + 'px Arial, sans-serif';
    const crossDist = document.getElementById('cross-road-dist').textContent;
    ctx.fillText(crossDist, 52, navMode ? 37 : 28);
    const nameX = navMode ? 52 + ctx.measureText(crossDist).width + 8 : 52;
    const nameW = navMode ? width - 130 - 8 - nameX : 126;
    let crossName = document.getElementById('cross-road-name').textContent;
    ctx.font = navMode ? '16px Arial, sans-serif' : '13px Arial, sans-serif';
    if (ctx.measureText(crossName).width > nameW) {
      while (crossName.length > 1 && ctx.measureText(crossName + '…').width > nameW) crossName = crossName.slice(0, -1);
      crossName += '…';
    }
    ctx.fillText(crossName, nameX, navMode ? 37 : 49);
    ctx.textAlign = 'center';
  }
  // Các hướng đi ở ngã phía trước, cùng vị trí với #junction
  const junction = document.getElementById('junction');
  if (!junction.classList.contains('hidden')) ctx.drawImage(junction, 10, 70, junction.width / 2, junction.height / 2);
  // Cảnh báo sắp tới camera, cùng vị trí và nhịp nháy với #cam-warning.
  // Nháy sáng rồi mờ chứ không tắt hẳn: lớp video cập nhật thưa nên có thể lỡ mất lúc sáng.
  if (!document.getElementById('cam-warning').classList.contains('hidden')) {
    ctx.globalAlpha = Date.now() % 600 < 300 ? 1 : 0.35;
    const text = document.getElementById('cam-warning-text').textContent;
    const camTop = 68;
    ctx.font = '800 18px Arial, sans-serif';
    const textW = ctx.measureText(text).width;
    const w = textW + 55;
    const x = width * 0.6 - w / 2;
    ctx.beginPath();
    ctx.roundRect(x, camTop, w, 38, 10);
    ctx.fillStyle = '#f59e0b';
    ctx.fill();
    ctx.drawImage(document.getElementById('cam-warning-icon'), x + 3, camTop + 3, 32, 32);
    ctx.fillStyle = '#111';
    ctx.fillText(text, x + 43 + textW / 2, camTop + 20);
    ctx.globalAlpha = 1;
  }
  // Tên đường
  let name = document.getElementById('gps-status').textContent;
  ctx.font = '600 15px Arial, sans-serif';
  const maxW = width * 0.62 - 28;
  if (ctx.measureText(name).width > maxW) {
    while (name.length > 1 && ctx.measureText(name + '…').width > maxW) name = name.slice(0, -1);
    name += '…';
  }
  const w = ctx.measureText(name).width + 28;
  const y = height - (navMode ? 58 : 22) - 28;
  ctx.beginPath();
  ctx.roundRect(width / 2 - w / 2, y, w, 28, 14);
  ctx.fillStyle = '#0a0a0c';
  ctx.fill();
  ctx.fillStyle = '#2fe0e6';
  ctx.fillText(name, width / 2, y + 15);
  // Thanh giờ tới, cùng vị trí với #nav-bar
  if (navMode && !document.getElementById('nav-bar').classList.contains('hidden')) {
    const barW = width - 62, barY = height - 16 - 36;
    ctx.beginPath();
    ctx.roundRect(10, barY, barW, 36, 10);
    ctx.fillStyle = '#0a0a0c';
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 16px Arial, sans-serif';
    ctx.fillText(document.getElementById('nav-bar-text').textContent, 10 + (barW - 34) / 2, barY + 19);
    ctx.fillText('✕', 10 + barW - 18, barY + 19);
  }
}
function drawMirror(force) {
  if (!mirrorTrack) return;
  const now = Date.now();
  if (force !== true && now - mirrorAt < MIRROR_FRAME_MS) return;
  mirrorAt = now;
  const source = map.getCanvas();
  const box = map.getContainer();
  if (!source.width || !source.height || !box.clientWidth || !box.clientHeight) return;
  const ctx = mirrorCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(source, 0, 0, mirrorCanvas.width, mirrorCanvas.height);
  ctx.setTransform(mirrorCanvas.width / box.clientWidth, 0, 0, mirrorCanvas.height / box.clientHeight, 0, 0);
  drawMirrorArrow(ctx);
  drawMirrorOverlay(ctx, box.clientWidth, box.clientHeight);
  mirrorTrack.requestFrame();
}
function startMirror() {
  if (!map) return;
  const canvas = document.createElement('canvas');
  if (!canvas.captureStream || !canvas.getContext('2d').roundRect) return;
  const stream = canvas.captureStream(0);
  const track = stream.getVideoTracks()[0];
  if (!track || !track.requestFrame) return;
  // Kích thước cố định: đổi kích thước canvas thì video ngừng nhận hình. Khung bản đồ đổi cỡ thì co giãn hình bên trong.
  const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.round(window.innerWidth * ratio);
  canvas.height = Math.round(window.innerHeight * ratio);
  mirrorCanvas = canvas;
  mirrorCtx = canvas.getContext('2d');
  mirrorTrack = track;
  const video = document.createElement('video');
  video.id = 'map-video';
  video.muted = true;
  video.autoplay = true;
  video.setAttribute('playsinline', '');
  video.disablePictureInPicture = true;
  const pane = document.getElementById('map-pane');
  // Video không chạy thì trở về bản đồ thường, không để đứng hình
  video.addEventListener('playing', function () { pane.classList.add('mirror'); });
  video.addEventListener('pause', function () { pane.classList.remove('mirror'); });
  video.addEventListener('error', function () { pane.classList.remove('mirror'); });
  document.getElementById('map').insertAdjacentElement('afterend', video);
  mirrorVideo = video;
  video.srcObject = stream;
  video.play().catch(function () {});
  document.addEventListener('pointerdown', function () { if (video.paused) video.play().catch(function () {}); });
  map.on('render', drawMirror);
  setInterval(function () { drawMirror(true); }, MIRROR_IDLE_MS);
  drawMirror(true);
}
startMirror();

// Mũi tên trượt cùng camera nên luôn đứng giữa và chỉ thẳng lên trên
if (map) map.on('move', function () {
  if (!follow || !navArrow) return;
  const c = map.getCenter();
  placeArrow(c.lng, c.lat, map.getBearing());
});

function onGPSError(err) {

/* ---------- Đặt vị trí tay (chạm vào bản đồ) ---------- */
if (map) map.on('click', function (e) {

/* ---------- Dữ liệu đường ----------
   Đọc từ các file có sẵn trong ROAD_DATA_URL (tạo bằng tools/build_roads.py),
   mỗi file là một ô lưới. Tìm đường ngay trong máy, không cần hỏi máy chủ. */
const roadTiles = new Map();    // 'x_y' -> các đoạn đường của ô đó
const tilesLoading = new Set();
const tileRetryAt = new Map();  // tải lỗi thì chờ đến lúc này mới thử lại
let lastPoint = null;

// Ô chứa vị trí hiện tại, thêm ô bên cạnh nếu đã gần ranh giới
function tilesNear(lat, lon) {
  const dLat = ROAD_TILE_EDGE_M / 111320;
  const dLon = dLat / Math.cos(lat * Math.PI / 180);
  const keys = new Set();
  for (const a of [-dLat, 0, dLat]) {
    for (const b of [-dLon, 0, dLon]) {
      keys.add(Math.floor((lon + b) / ROAD_TILE_DEG) + '_' + Math.floor((lat + a) / ROAD_TILE_DEG));
    }
  }
  return Array.from(keys);
}

function decodeWay(record, index, key) {
  const [name, type, oneway, limitForward, limitBackward, coords] = record;
  const points = [];
  let lat = 0, lon = 0;
  for (let i = 0; i + 1 < coords.length; i += 2) {
    lat += coords[i];
    lon += coords[i + 1];
    points.push([lat / 1e5, lon / 1e5]);
  }
  return {
    id: key + ':' + index,
    name,
    oneway: oneway > 0,
    reversed: oneway === 2,
    limitForward,
    limitBackward,
    estimate: ESTIMATED_LIMITS[ROAD_TYPES[type]] || null,
    points
  };
}

async function loadTile(key) {
  tilesLoading.add(key);
  try {
    const r = await fetchWithTimeout(ROAD_DATA_URL + key + '.json', 20000);
    if (r.status !== 404 && !r.ok) throw new Error('HTTP ' + r.status);
    // 404 = ô không có đường nào (biển, ngoài Việt Nam)
    const records = (r.status === 404) ? [] : await r.json();
    roadTiles.set(key, records.map((rec, i) => decodeWay(rec, i, key)));
    tileRetryAt.delete(key);
    // Giữ bộ nhớ gọn: bỏ các ô cũ không còn ở gần
    const near = lastPoint ? tilesNear(lastPoint.lat, lastPoint.lon) : [];
    for (const k of roadTiles.keys()) {
      if (roadTiles.size <= ROAD_TILES_IN_MEMORY) break;
      if (!near.includes(k)) roadTiles.delete(k);
    }
  } catch (e) {
    tileRetryAt.set(key, Date.now() + 20000);
  }
  tilesLoading.delete(key);
  if (lastPoint) updateLimitFromRoads(lastPoint.lat, lastPoint.lon, lastPoint.heading);
}

// Tìm đường đang chạy: gần vị trí nhất và cùng hướng với xe
function matchRoad(lat, lon, heading) {
  const cosLat = Math.cos(lat * Math.PI / 180);
  let best = null;
  for (const key of tilesNear(lat, lon)) {
    for (const way of roadTiles.get(key) || []) {
      for (let i = 0; i + 1 < way.points.length; i++) {
        const a = way.points[i], b = way.points[i + 1];
        const ax = (a[1] - lon) * 111320 * cosLat, ay = (a[0] - lat) * 111320;
        const bx = (b[1] - lon) * 111320 * cosLat, by = (b[0] - lat) * 111320;
        const sx = bx - ax, sy = by - ay;
        const len2 = sx * sx + sy * sy;
        if (!len2) continue;
        const u = Math.max(0, Math.min(1, -(ax * sx + ay * sy) / len2));
        const dist = Math.hypot(ax + u * sx, ay + u * sy);
        if (dist > ROAD_MATCH_M) continue;

        let score = dist;
        let forward = true;
        if (heading != null) {
          const segBearing = (Math.atan2(sx, sy) * 180 / Math.PI + 360) % 360;
          let diff = Math.abs(segBearing - heading) % 360;
          if (diff > 180) diff = 360 - diff;
          forward = diff <= 90;
          // Đường hai chiều: đi hướng nào cũng khớp. Một chiều: đi ngược thì bị trừ điểm.
          const allowedDiff = way.oneway ? (way.reversed ? 180 - diff : diff) : Math.min(diff, 180 - diff);
          score += allowedDiff * 0.5;
        }
        if (way.id === currentWayId) score -= 8;   // đừng nhảy qua lại giữa hai đường sát nhau
        if (!best || score < best.score) {
          const seg = (Math.atan2(sx, sy) * 180 / Math.PI + 360) % 360;
          best = {
            way, forward, score, dist, segment: i,
            bearing: forward ? seg : (seg + 180) % 360,
            lat: lat + (ay + u * sy) / 111320,
            lon: lon + (ax + u * sx) / (111320 * cosLat)
          };
        }
      }
    }
  }
  return best;
}

let currentWayId = null;
let lastLimitAt = 0;          // lần cuối xác định được đường đang chạy

// Tô màu con đường đang chạy trên bản đồ
let highlightedWayId = null;
function highlightRoad(way) {
  const source = map && map.getSource('current-road');
  const id = way ? way.id : null;
  if (!source || id === highlightedWayId) return;
  highlightedWayId = id;
  source.setData(way
    ? { type: 'Feature', geometry: { type: 'LineString', coordinates: way.points.map(p => [p[1], p[0]]) } }
    : { type: 'FeatureCollection', features: [] });
}

/* ---------- Đường sắp cắt qua ----------
   Đi tiếp theo con đường đang chạy, tìm đường có tên đầu tiên cắt ngang.
   Không có điểm đến nên đây chỉ là đường sắp gặp nếu đi thẳng, không phải chỉ đường. */
function shortRoadName(name) {
  return name.replace(/^(Đường|Phố)\s+/i, '').trim().toLowerCase();
}
// Hẻm và nhánh rẽ (ví dụ "Đi Cầu Chà Và", "Nhánh N1") không tính là con đường để báo
function isMinorRoadName(name) {
  return /^(Hẻm|Ngõ|Ngách|Kiệt|Đi|Nhánh)\s/i.test(name);
}

// Các điểm phía trước xe theo con đường đang chạy, nối sang đoạn sau nếu cùng tên
function roadAhead(match, maxM) {
  const way = match.way;
  const firstPoints = match.forward ? way.points.slice(match.segment + 1) : way.points.slice(0, match.segment + 1).reverse();
  const path = [[match.lat, match.lon], ...firstPoints];
  const seen = new Set([way.id]);
  const name = shortRoadName(way.name);
  const lengthOf = () => {
    let total = 0;
    for (let i = 0; i + 1 < path.length; i++) total += distanceM(path[i][0], path[i][1], path[i + 1][0], path[i + 1][1]);
    return total;
  };
  while (name && lengthOf() < maxM) {
    const end = path[path.length - 1];
    // Điểm liền trước có thể trùng điểm cuối (xe đứng ngay chỗ nối hai đoạn), lùi tới điểm khác hẳn
    let k = path.length - 2;
    while (k > 0 && path[k][0] === end[0] && path[k][1] === end[1]) k--;
    const before = path[k];
    const direction = (before[0] === end[0] && before[1] === end[1]) ? match.bearing : bearingDeg(before[0], before[1], end[0], end[1]);
    let next = null;
    for (const key of tilesNear(end[0], end[1])) {
      for (const other of roadTiles.get(key) || []) {
        if (seen.has(other.id) || shortRoadName(other.name) !== name) continue;
        const pts = other.points, last = pts.length - 1;
        for (const [start, second, flip] of [[pts[0], pts[1], false], [pts[last], pts[last - 1], true]]) {
          // Đường một chiều chỉ đi đúng chiều, tránh nhảy sang chiều ngược bên kia dải phân cách
          if (other.oneway && flip !== other.reversed) continue;
          const gap = distanceM(end[0], end[1], start[0], start[1]);
          if (gap > SAME_ROAD_JOIN_M || (next && gap >= next.gap)) continue;
          if (Math.abs(angleDelta(direction, bearingDeg(start[0], start[1], second[0], second[1]))) > SAME_ROAD_TURN) continue;
          next = { other, gap, pts: flip ? pts.slice().reverse() : pts };
        }
      }
    }
    if (!next) break;
    seen.add(next.other.id);
    path.push(...next.pts);
  }
  return path;
}

function nextCrossRoad(match) {
  const path = roadAhead(match, CROSS_ROAD_M);
  const name = shortRoadName(match.way.name);
  const cosLat = Math.cos(match.lat * Math.PI / 180);
  const toXY = p => [(p[1] - match.lon) * 111320 * cosLat, (p[0] - match.lat) * 111320];
  const line = path.map(toXY);
  // Khung bao quanh đoạn đường phía trước, để bỏ nhanh các đường ở xa mà không phải tính
  const marginLat = CROSS_JOIN_M / 111320, marginLon = marginLat / cosLat;
  const minLat = Math.min(...path.map(p => p[0])) - marginLat, maxLat = Math.max(...path.map(p => p[0])) + marginLat;
  const minLon = Math.min(...path.map(p => p[1])) - marginLon, maxLon = Math.max(...path.map(p => p[1])) + marginLon;
  const lengths = [0];
  for (let i = 0; i + 1 < line.length; i++) lengths.push(lengths[i] + Math.hypot(line[i + 1][0] - line[i][0], line[i + 1][1] - line[i][1]));

  const hits = [];
  // heading: hướng của đoạn đường đang chạy tại điểm giao; exits: các hướng có thể rẽ vào
  const consider = (dist, way, heading, exits) => {
    if (dist < CROSS_ROAD_MIN_M || dist > CROSS_ROAD_M) return;
    hits.push({ dist, name: way.name, turns: exits.map(([x, y]) => angleDelta(heading, Math.atan2(x, y) * 180 / Math.PI)) });
  };
  const tiles = new Set(path.flatMap(p => tilesNear(p[0], p[1])));
  for (const key of tiles) {
    for (const way of roadTiles.get(key) || []) {
      if (!way.name) continue;
      const raw = way.points;
      if (raw.every(p => p[0] < minLat) || raw.every(p => p[0] > maxLat) || raw.every(p => p[1] < minLon) || raw.every(p => p[1] > maxLon)) continue;
      if (isMinorRoadName(way.name) || shortRoadName(way.name) === name) continue;
      const pts = raw.map(toXY);
      // Đường một chiều chỉ rẽ vào được theo đúng chiều của nó
      const canForward = !way.oneway || !way.reversed, canBackward = !way.oneway || way.reversed;
      for (let i = 0; i + 1 < line.length; i++) {
        const [ax, ay] = line[i], [bx, by] = line[i + 1];
        const sx = bx - ax, sy = by - ay, len2 = sx * sx + sy * sy;
        if (!len2) continue;
        const heading = Math.atan2(sx, sy) * 180 / Math.PI;
        // Đường cắt ngang đoạn này
        for (let j = 0; j + 1 < pts.length; j++) {
          const [cx, cy] = pts[j], [dx, dy] = pts[j + 1];
          const rx = dx - cx, ry = dy - cy, cross = sx * ry - sy * rx;
          if (!cross) continue;
          const t = ((cx - ax) * ry - (cy - ay) * rx) / cross;
          const v = ((cx - ax) * sy - (cy - ay) * sx) / cross;
          if (t >= 0 && t <= 1 && v >= 0 && v <= 1) {
            const exits = [];
            if (canForward) exits.push([rx, ry]);
            if (canBackward) exits.push([-rx, -ry]);
            consider(lengths[i] + t * Math.sqrt(len2), way, heading, exits);
          }
        }
        // Ngã ba: đường kia kết thúc ngay trên đường đang chạy
        const last = pts.length - 1;
        for (const [p, q, allowed] of [[pts[0], pts[1], canForward], [pts[last], pts[last - 1], canBackward]]) {
          const t = ((p[0] - ax) * sx + (p[1] - ay) * sy) / len2;
          if (t < 0 || t > 1) continue;
          if (Math.hypot(ax + t * sx - p[0], ay + t * sy - p[1]) <= CROSS_JOIN_M) {
            consider(lengths[i] + t * Math.sqrt(len2), way, heading, allowed ? [[q[0] - p[0], q[1] - p[1]]] : []);
          }
        }
      }
    }
  }
  if (!hits.length) return null;
  const first = hits.reduce((a, b) => (b.dist < a.dist ? b : a));
  // Gom các điểm giao sát nhau thành một ngã, rồi lấy các hướng đi khác nhau từ trái sang phải
  const turns = hits.filter(h => h.dist <= first.dist + JUNCTION_SPREAD_M).flatMap(h => h.turns);
  if (lengths[lengths.length - 1] - first.dist >= JUNCTION_STRAIGHT_M) turns.push(0);
  const exits = [];
  for (const turn of turns.filter(a => Math.abs(a) <= JUNCTION_BACK_ANGLE).sort((a, b) => a - b)) {
    if (!exits.length || turn - exits[exits.length - 1] >= JUNCTION_MERGE_ANGLE) exits.push(turn);
  }
  return { dist: first.dist, name: first.name, exits };
}

// Vẽ khung mũi tên giống bảng hướng dẫn làn, mỗi mũi tên chỉ đúng góc của lối đi
const JUNCTION_CELL = 30;
let junctionDrawn = '';
function drawJunction(exits) {
  const key = exits.map(a => Math.round(a / 5)).join();
  if (key === junctionDrawn) return;
  junctionDrawn = key;
  const canvas = document.getElementById('junction');
  const cssWidth = exits.length * JUNCTION_CELL + 8;
  canvas.width = cssWidth * 2;     // vẽ gấp đôi cho nét, canvas này không phải canvas của lớp video
  canvas.height = 80;
  canvas.style.width = cssWidth + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2);
  ctx.beginPath();
  ctx.roundRect(1, 1, cssWidth - 2, 38, 7);
  ctx.fillStyle = '#10151c';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#1e8fff';
  ctx.stroke();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  exits.forEach((turn, i) => {
    const x = 4 + JUNCTION_CELL * (i + 0.5), rad = turn * Math.PI / 180;
    if (i) {
      ctx.save();
      ctx.setLineDash([2, 3]);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath();
      ctx.moveTo(4 + JUNCTION_CELL * i, 7);
      ctx.lineTo(4 + JUNCTION_CELL * i, 33);
      ctx.stroke();
      ctx.restore();
    }
    // Thân đi lên từ dưới, tới giữa thì bẻ theo góc của lối đi; đầu mũi tên ở cuối
    const midY = 24, tipX = x + Math.sin(rad) * 12, tipY = midY - Math.cos(rad) * 12;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, 33);
    ctx.lineTo(x, midY);
    ctx.lineTo(tipX, tipY);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    for (const [side, back] of [[0, -3], [6, 6], [-6, 6]]) {
      ctx.lineTo(tipX + Math.sin(rad) * -back + Math.cos(rad) * side, tipY + Math.cos(rad) * back + Math.sin(rad) * side);
    }
    ctx.closePath();
    ctx.fill();
  });
}

function updateCrossRoad(match) {
  if (navActive) return;   // đang dẫn đường thì khung này báo hướng rẽ
  const cross = match ? nextCrossRoad(match) : null;
  document.getElementById('cross-road').classList.toggle('hidden', !cross);
  const showJunction = !!cross && cross.dist <= JUNCTION_WARN_M && cross.exits.length >= JUNCTION_MIN_EXITS;
  document.getElementById('junction').classList.toggle('hidden', !showJunction);
  if (showJunction) drawJunction(cross.exits);
  if (!cross) return;
  document.getElementById('cross-road-dist').textContent = Math.round(cross.dist / 10) * 10 + ' m';
  document.getElementById('cross-road-name').textContent = cross.name;
}

let lastMatch = null;
function updateLimitFromRoads(lat, lon, heading) {
  const match = matchRoad(lat, lon, heading);
  lastMatch = match;
  updateCrossRoad(match);
  if (match) {
    const way = match.way;
    const known = match.forward ? way.limitForward : way.limitBackward;
    currentWayId = way.id;
    lastLimitAt = Date.now();
    highlightRoad(way);
    const limit = matchSpeedLimit(lat, lon, heading) || known;
    if (limit) renderSpeedLimit(limit, false);
    else renderSpeedLimit(way.estimate, true);
    if (way.name) setStatus(way.name);
  } else if (matchSpeedLimit(lat, lon, heading)) {
    // Không khớp được đường trong data/roads nhưng vẫn có giới hạn tốc độ
    lastLimitAt = Date.now();
    renderSpeedLimit(matchSpeedLimit(lat, lon, heading), false);
  } else {
    if (Date.now() - lastLimitAt > LIMIT_STALE_MS) {
      currentWayId = null;
      highlightRoad(null);
      renderSpeedLimit(null, false);
    }
    if (tilesNear(lat, lon).some(k => tileRetryAt.has(k))) {
      setStatus('⚠️ Chưa tải được dữ liệu đường, đang thử lại…');
    }
  }
}

/* ---------- Giới hạn tốc độ theo đoạn đường ----------
   Đọc từ SPEED_DATA_URL, chia ô giống dữ liệu đường. Mỗi đoạn có giới hạn cho chiều thuận và chiều ngược.
   Có số ở đây thì dùng, không thì mới dùng số của OpenStreetMap trong data/roads. */
const speedTiles = new Map();   // 'x_y' -> Map(ô nhỏ -> các đoạn [lat1, lon1, lat2, lon2, thuận, ngược])
const speedLoading = new Set();
const speedRetryAt = new Map();

function speedCellKey(lat, lon) {
  return Math.floor(lon / SPEED_CELL_DEG) + '_' + Math.floor(lat / SPEED_CELL_DEG);
}

async function loadSpeedTile(key) {
  speedLoading.add(key);
  try {
    const r = await fetchWithTimeout(SPEED_DATA_URL + key + '.json', 30000);
    if (r.status !== 404 && !r.ok) throw new Error('HTTP ' + r.status);
    const flat = r.status === 404 ? [] : (await r.json()).s;   // 404 = ô không có dữ liệu
    const [x0, y0] = key.split('_').map(v => Number(v) * ROAD_TILE_DEG);
    const cells = new Map();
    for (let i = 0; i + 5 < flat.length; i += 6) {
      const seg = [y0 + flat[i + 1] / 1e5, x0 + flat[i] / 1e5, y0 + flat[i + 3] / 1e5, x0 + flat[i + 2] / 1e5,
                   flat[i + 4], flat[i + 5]];
      // Đưa đoạn vào mọi ô nhỏ mà khung bao của nó chạm tới
      const cx0 = Math.floor(Math.min(seg[1], seg[3]) / SPEED_CELL_DEG), cx1 = Math.floor(Math.max(seg[1], seg[3]) / SPEED_CELL_DEG);
      const cy0 = Math.floor(Math.min(seg[0], seg[2]) / SPEED_CELL_DEG), cy1 = Math.floor(Math.max(seg[0], seg[2]) / SPEED_CELL_DEG);
      for (let cx = cx0; cx <= cx1; cx++) {
        for (let cy = cy0; cy <= cy1; cy++) {
          const k = cx + '_' + cy;
          if (!cells.has(k)) cells.set(k, []);
          cells.get(k).push(seg);
        }
      }
    }
    speedTiles.set(key, cells);
    speedRetryAt.delete(key);
    const near = lastPoint ? tilesNear(lastPoint.lat, lastPoint.lon) : [];
    for (const k of speedTiles.keys()) {
      if (speedTiles.size <= ROAD_TILES_IN_MEMORY) break;
      if (!near.includes(k)) speedTiles.delete(k);
    }
  } catch (e) {
    speedRetryAt.set(key, Date.now() + 20000);
  }
  speedLoading.delete(key);
  if (lastPoint) updateLimitFromRoads(lastPoint.lat, lastPoint.lon, lastPoint.heading);
}

// Giới hạn của đoạn gần xe nhất và cùng hướng với xe. Chưa biết hướng thì chỉ nhận đoạn có hai chiều như nhau.
function matchSpeedLimit(lat, lon, heading) {
  const cosLat = Math.cos(lat * Math.PI / 180);
  const seen = new Set();
  let best = null;
  for (const da of [-SPEED_CELL_DEG, 0, SPEED_CELL_DEG]) {
    for (const db of [-SPEED_CELL_DEG, 0, SPEED_CELL_DEG]) {
      const tile = speedTiles.get(Math.floor((lon + db) / ROAD_TILE_DEG) + '_' + Math.floor((lat + da) / ROAD_TILE_DEG));
      const segs = tile && tile.get(speedCellKey(lat + da, lon + db));
      if (!segs) continue;
      for (const seg of segs) {
        if (seen.has(seg)) continue;
        seen.add(seg);
        const ax = (seg[1] - lon) * 111320 * cosLat, ay = (seg[0] - lat) * 111320;
        const sx = (seg[3] - lon) * 111320 * cosLat - ax, sy = (seg[2] - lat) * 111320 - ay;
        const len2 = sx * sx + sy * sy;
        if (!len2) continue;
        const u = Math.max(0, Math.min(1, -(ax * sx + ay * sy) / len2));
        const dist = Math.hypot(ax + u * sx, ay + u * sy);
        if (dist > SPEED_MATCH_M) continue;
        let score = dist, limit = seg[4];
        if (heading != null) {
          const diff = Math.abs(angleDelta((Math.atan2(sx, sy) * 180 / Math.PI + 360) % 360, heading));
          if (diff > 90) limit = seg[5];
          score += Math.min(diff, 180 - diff) * 0.5;
        } else if (seg[4] !== seg[5]) {
          continue;
        }
        if (limit && (!best || score < best.score)) best = { score, limit };
      }
    }
  }
  return best && best.limit;
}

/* ---------- Biển báo và camera ----------
   Đọc từ SIGN_DATA_URL, chia ô giống dữ liệu đường. Icon lấy từ SIGN_ICON_URL theo danh sách SIGN_TYPES_URL.
   Biển đèn giao thông chỉ là vị trí: không có dữ liệu đèn đang xanh hay đỏ. */
const signTiles = new Map();    // 'x_y' -> các điểm của ô đó, dạng GeoJSON
const signRetryAt = new Map();
const signImages = new Map();   // tên icon -> ảnh đã tải xong
let signTypes = null;           // { signs: [[mã, tên, file icon]], cams: [...] }

// Tải danh sách loại và mọi icon một lần. Chưa xong thì chưa vẽ biển lên bản đồ.
const signTypesReady = (async function () {
  for (let attempt = 0; ; attempt++) {
    try {
      const r = await fetchWithTimeout(SIGN_TYPES_URL, 20000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      signTypes = await r.json();
      break;
    } catch (e) {
      await new Promise(done => setTimeout(done, Math.min(60000, 5000 * (attempt + 1))));
    }
  }
  const all = [...signTypes.signs.map((t, i) => ['sb-' + i, t[2]]), ...signTypes.cams.map((t, i) => ['sc-' + i, t[2]])];
  await Promise.all(all.map(([id, file]) => new Promise(done => {
    const img = new Image();
    img.onload = () => { signImages.set(id, img); done(); };
    img.onerror = () => done();   // thiếu icon thì biển đó không hiện, các biển khác vẫn hiện
    img.src = SIGN_ICON_URL + file;
  })));
  renderSigns();
})();

function renderSigns() {
  const source = map && map.getSource('signs');
  if (!source || !signTypes) return;
  source.setData({ type: 'FeatureCollection', features: Array.from(signTiles.values()).flat() });
}
if (map) map.on('load', renderSigns);

async function loadSignTile(key) {
  signTiles.set(key, []);     // đánh dấu để không tải trùng
  try {
    await signTypesReady;
    const r = await fetchWithTimeout(SIGN_DATA_URL + key + '.json', 20000);
    if (r.status !== 404 && !r.ok) throw new Error('HTTP ' + r.status);
    const tile = r.status === 404 ? { b: [], c: [] } : await r.json();   // 404 = ô không có biển nào
    const point = (lat, lon, properties) => ({
      type: 'Feature', properties, geometry: { type: 'Point', coordinates: [lon / 1e5, lat / 1e5] }
    });
    signTiles.set(key, [
      ...tile.b.map(([lat, lon, type, heading]) => point(lat, lon, { icon: 'sb-' + type, heading, isCamera: false })),
      // Camera có giới hạn tốc độ: icon kèm con số, ví dụ sc-3-60
      ...tile.c.map(([lat, lon, type, limit]) => point(lat, lon, {
        icon: 'sc-' + type + (limit ? '-' + limit : ''), name: signTypes.cams[type][1], isCamera: true
      }))
    ]);
    const near = lastPoint ? tilesNear(lastPoint.lat, lastPoint.lon) : [];
    for (const k of signTiles.keys()) {
      if (signTiles.size <= ROAD_TILES_IN_MEMORY) break;
      if (!near.includes(k)) signTiles.delete(k);
    }
    renderSigns();
  } catch (e) {
    signTiles.delete(key);
    signRetryAt.set(key, Date.now() + 20000);
  }
}

// Vẽ biểu tượng lúc bản đồ cần tới
const SIGN_ICON_PX = 64;
function drawSignIcon(ctx, id) {
  const S = SIGN_ICON_PX, c = S / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (id.indexOf('sb-') === 0 || id.indexOf('sc-') === 0) {
    const [group, type, limit] = id.split('-');
    const img = signImages.get(group + '-' + type);
    if (img) ctx.drawImage(img, 0, 0, S, S);
    if (limit) {
      // Giới hạn tốc độ của camera: biển tròn nhỏ ở góc dưới bên phải
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(S - 17, S - 17, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.font = 'bold ' + (limit.length > 2 ? 13 : 16) + 'px Arial';
      ctx.fillText(limit, S - 17, S - 16);
    }
  } else if (id === 'sign-fuel') {
    ctx.fillStyle = '#15803d';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(4, 4, S - 8, S - 8, 12);
    ctx.fill();
    ctx.stroke();
    // Trụ bơm
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.roundRect(16, 13, 22, 36, 3);
    ctx.fill();
    ctx.fillRect(12, 47, 30, 5);
    ctx.fillStyle = '#15803d';
    ctx.fillRect(20, 18, 14, 10);
    // Vòi bơm
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(38, 21);
    ctx.lineTo(47, 28);
    ctx.lineTo(47, 41);
    ctx.quadraticCurveTo(47, 45, 43, 45);
    ctx.quadraticCurveTo(39, 45, 39, 41);
    ctx.lineTo(39, 33);
    ctx.stroke();
  } else if (id === 'sign-place') {
    // Ghim đỏ, mũi ghim ở sát đáy hình
    ctx.fillStyle = '#e11d2e';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(c, 24, 19, Math.PI * 0.85, Math.PI * 0.15);
    ctx.lineTo(c, S - 3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(c, 24, 7, 0, Math.PI * 2);
    ctx.fill();
  }
}
if (map) map.on('styleimagemissing', function (e) {
  if (!/^(sign|sb|sc)-/.test(e.id)) return;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = SIGN_ICON_PX;
  const ctx = canvas.getContext('2d');
  drawSignIcon(ctx, e.id);
  map.addImage(e.id, ctx.getImageData(0, 0, SIGN_ICON_PX, SIGN_ICON_PX), { pixelRatio: 2 });
});

/* ---------- Cảnh báo sắp tới camera ----------
   Lấy camera gần nhất nằm trên hướng xe đang chạy. Chưa biết hướng xe thì tính mọi phía. */
function nearestCameraAhead(lat, lon, heading) {
  let best = null;
  for (const features of signTiles.values()) {
    for (const f of features) {
      if (!f.properties.isCamera) continue;
      const [camLon, camLat] = f.geometry.coordinates;
      const dist = distanceM(lat, lon, camLat, camLon);
      if (dist > CAM_WARN_M || (best && dist >= best.dist)) continue;
      if (heading != null) {
        const off = angleDelta(heading, bearingDeg(lat, lon, camLat, camLon)) * Math.PI / 180;
        if (Math.cos(off) <= 0 || dist * Math.abs(Math.sin(off)) > CAM_WARN_SIDE_M) continue;
      }
      best = { dist, icon: f.properties.icon };
    }
  }
  return best;
}

let camWarningIcon = null;
function updateCameraWarning(lat, lon, heading) {
  const box = document.getElementById('cam-warning');
  const cam = nearestCameraAhead(lat, lon, heading);
  box.classList.toggle('hidden', !cam);
  if (!cam) return;
  document.getElementById('cam-warning-text').textContent = Math.round(cam.dist / 10) * 10 + ' m';
  if (cam.icon !== camWarningIcon) {
    camWarningIcon = cam.icon;
    const canvas = document.getElementById('cam-warning-icon');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawSignIcon(ctx, cam.icon);
  }
}

/* ---------- Tìm địa điểm ----------
   Gửi chữ bạn gõ tới Photon (dữ liệu OpenStreetMap). Để ưu tiên nơi gần xe, chỉ gửi vị trí làm tròn
   tới 0,1 độ (khoảng 11 km), không gửi vị trí chính xác. Chọn một điểm thì bắt đầu dẫn đường, xem phần dưới. */
const placeInput = document.getElementById('place-input');
const placeList = document.getElementById('place-list');
let placeTimer = null;
let placeToken = 0;       // bỏ qua kết quả của lần gõ cũ
let currentPlace = null;  // điểm đang ghim trên bản đồ

function placeHistory() {
  try {
    return JSON.parse(localStorage.getItem(PLACE_HISTORY_KEY)) || [];
  } catch (e) {
    return [];
  }
}
function savePlaceHistory(list) {
  try {
    localStorage.setItem(PLACE_HISTORY_KEY, JSON.stringify(list));
  } catch (e) {}
}

function placeSaved() {
  try {
    return JSON.parse(localStorage.getItem(PLACE_SAVED_KEY)) || {};
  } catch (e) {
    return {};
  }
}
function savePlaceSaved(saved) {
  try {
    localStorage.setItem(PLACE_SAVED_KEY, JSON.stringify(saved));
  } catch (e) {}
}
function samePlace(a, b) {
  return !!a && !!b && a.name === b.name && a.lat === b.lat && a.lon === b.lon;
}

function setPlaceHead(title, canClear) {
  document.getElementById('place-list-head').classList.toggle('hidden', !title);
  document.getElementById('place-list-title').textContent = title || '';
  document.getElementById('place-clear').classList.toggle('hidden', !canClear);
}
function showPlaceMessage(text, title) {
  setPlaceHead(title);
  placeList.innerHTML = '';
  const el = document.createElement('div');
  el.id = 'place-message';
  el.textContent = text;
  placeList.appendChild(el);
}

// Hàng nút hiện ra khi bấm ⋯: lưu Nhà, Cơ quan, Yêu thích, hoặc xoá khỏi lịch sử
function placeActions(place, isHistory, refresh) {
  const saved = placeSaved();
  const box = document.createElement('div');
  box.className = 'place-actions';
  const add = (label, on, action) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.classList.toggle('on', on);
    b.addEventListener('click', () => { action(); refresh(); });
    box.appendChild(b);
  };
  const toggleSlot = slot => {
    const next = placeSaved();
    next[slot] = samePlace(next[slot], place) ? null : place;
    savePlaceSaved(next);
  };
  add('🏠 Nhà', samePlace(saved.home, place), () => toggleSlot('home'));
  add('🏢 Cơ quan', samePlace(saved.work, place), () => toggleSlot('work'));
  const liked = (saved.favorites || []).some(o => samePlace(o, place));
  add(liked ? '❤️ Bỏ thích' : '❤️ Yêu thích', liked, () => {
    const next = placeSaved();
    const rest = (next.favorites || []).filter(o => !samePlace(o, place));
    next.favorites = liked ? rest : [place, ...rest];
    savePlaceSaved(next);
  });
  if (isHistory) add('Xoá', false, () => savePlaceHistory(placeHistory().filter(o => !samePlace(o, place))));
  return box;
}

const CLOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 4v4.5H8"/><path d="M12 7.5V12l3 2"/></svg>';
function showPlaces(places, isHistory, refresh) {
  placeList.innerHTML = '';
  places.forEach((place, i) => {
    const row = document.createElement('div');
    row.className = 'place-row';
    if (isHistory) row.insertAdjacentHTML('beforeend', CLOCK_ICON);
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'place-item';
    const title = document.createElement('b');
    title.textContent = place.name;
    const detail = document.createElement('span');
    detail.textContent = place.detail;
    item.append(title, detail);
    item.addEventListener('click', () => choosePlace(place));
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'place-more';
    more.textContent = '⋯';
    more.title = 'Lưu địa điểm';
    more.addEventListener('click', () => {
      const open = row.querySelector('.place-actions');
      if (open) return open.remove();
      row.appendChild(placeActions(place, isHistory, () => {
        refresh();
        // Vẽ lại danh sách xong thì mở lại hàng nút, trừ khi dòng này vừa bị xoá
        const again = placeList.children[i];
        const title = again && again.querySelector('b');
        if (title && title.textContent === place.name) again.querySelector('.place-more').click();
      }));
    });
    row.append(item, more);
    placeList.appendChild(row);
  });
}
function showPlaceHistory() {
  const history = placeHistory();
  if (!history.length) return showPlaceMessage('Gõ tên đường hoặc địa điểm để tìm');
  setPlaceHead('Lịch sử tìm kiếm', true);
  showPlaces(history, true, showPlaceHistory);
}
function showFavorites() {
  placeToken++;
  const favorites = placeSaved().favorites || [];
  if (!favorites.length) return showPlaceMessage('Chưa có. Tìm địa điểm rồi bấm ⋯ để thêm vào Yêu thích', 'Yêu thích');
  setPlaceHead('Yêu thích');
  showPlaces(favorites, false, showFavorites);
}
function openShortcut(shortcut) {
  if (shortcut.saved === 'favorites') return showFavorites();
  if (shortcut.saved) {
    placeToken++;
    const place = placeSaved()[shortcut.saved];
    if (place) return choosePlace(place);
    return showPlaceMessage('Chưa lưu ' + shortcut.label + '. Tìm địa điểm rồi bấm ⋯ để lưu', shortcut.label);
  }
  if (!lastPoint) return showPlaceMessage('Cần có GPS để tìm ' + shortcut.label + ' gần xe', shortcut.label);
  findNearby(shortcut);
}
async function findNearby(shortcut) {
  const token = ++placeToken;
  showPlaceMessage('Đang tìm…', shortcut.label);
  const lat = Math.round(lastPoint.lat * 10) / 10, lon = Math.round(lastPoint.lon * 10) / 10;
  const box = [lon - PLACE_NEAR_DEG, lat - PLACE_NEAR_DEG, lon + PLACE_NEAR_DEG, lat + PLACE_NEAR_DEG].map(v => v.toFixed(1)).join(',');
  let url = 'https://photon.komoot.io/api/?limit=8&bbox=' + box + '&lat=' + lat.toFixed(1) + '&lon=' + lon.toFixed(1) + '&q=' + encodeURIComponent(shortcut.query);
  if (shortcut.tag) url += '&osm_tag=' + shortcut.tag;
  try {
    const places = await fetchPlaces(url);
    if (token !== placeToken) return;
    if (!places.length) return showPlaceMessage('Chưa có dữ liệu ' + shortcut.label + ' trong khoảng 50 km quanh xe', shortcut.label);
    places.sort((a, b) => distanceM(lastPoint.lat, lastPoint.lon, a.lat, a.lon) - distanceM(lastPoint.lat, lastPoint.lon, b.lat, b.lon));
    const render = () => {
      setPlaceHead(shortcut.label);
      showPlaces(places, false, render);
    };
    render();
  } catch (e) {
    if (token === placeToken) showPlaceMessage('Không tìm được, hãy kiểm tra mạng rồi thử lại', shortcut.label);
  }
}
for (const shortcut of PLACE_SHORTCUTS) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'place-shortcut';
  const icon = document.createElement('i');
  icon.textContent = shortcut.icon;
  const label = document.createElement('span');
  label.textContent = shortcut.label;
  b.append(icon, label);
  b.addEventListener('click', () => openShortcut(shortcut));
  document.getElementById('place-shortcuts').appendChild(b);
}

function toPlace(feature) {
  const p = feature.properties;
  const road = [p.housenumber, p.street].filter(Boolean).join(' ');
  const name = p.name || road;
  if (!name) return null;
  const parts = [p.name ? road : '', p.district, p.city, p.state].filter(Boolean);
  const [lon, lat] = feature.geometry.coordinates;
  return { name, detail: parts.filter((part, i) => parts.indexOf(part) === i).join(', '), lat, lon };
}

async function fetchPlaces(url) {
  const r = await fetchWithTimeout(url, 10000);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  const places = [];
  for (const place of data.features.map(toPlace)) {
    if (!place) continue;
    if (places.some(o => o.name === place.name && distanceM(o.lat, o.lon, place.lat, place.lon) < PLACE_SAME_M)) continue;
    places.push(place);
  }
  return places;
}

async function searchPlaces() {
  const q = placeInput.value.trim();
  const token = ++placeToken;
  // Đang gõ thì ẩn các ô tắt để có chỗ cho kết quả, màn hình xe rất thấp
  document.getElementById('place-shortcuts').classList.toggle('hidden', !!q);
  if (!q) return showPlaceHistory();
  setPlaceHead(null);
  let url = PLACE_SEARCH_URL + '&q=' + encodeURIComponent(q);
  if (lastPoint) url += '&lat=' + lastPoint.lat.toFixed(1) + '&lon=' + lastPoint.lon.toFixed(1);
  try {
    const places = await fetchPlaces(url);
    if (token !== placeToken) return;
    const render = () => showPlaces(places, false, render);
    if (places.length) render();
    else showPlaceMessage('Không tìm thấy địa điểm này');
  } catch (e) {

  }
}

function formatDistance(m) {
  return m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km';
}

/* ---------- Dẫn đường ----------
   Tính tuyến bằng OSRM (dữ liệu OpenStreetMap). Dịch vụ cần vị trí chính xác của xe và điểm đến.
   Tuyến và ghim vẽ trong bản đồ, khung hướng rẽ vẽ cả trên lớp video, nên lúc khóa máy vẫn thấy. */
let navRoute = null;      // { points, lengths, total, duration, steps }
let navActive = false;    // đã bấm Bắt đầu
let navArrived = false;
let navSegment = 0;       // đoạn tuyến xe đang đi
let navOffFixes = 0;
let navRequesting = false;
let navRetryAt = 0;
let navFailed = false;
let navPreview = false;   // đã bấm Xem lộ trình, đang xem toàn tuyến

function renderNavBar(remainM) {
  if (!currentPlace) return;
  let text;
  if (navArrived) {
    text = 'Đã tới · ' + currentPlace.name;
  } else if (navRoute && remainM != null) {
    const seconds = navRoute.duration * remainM / navRoute.total;
    const arrive = new Date(Date.now() + seconds * 1000);
    const clock = String(arrive.getHours()).padStart(2, '0') + ':' + String(arrive.getMinutes()).padStart(2, '0');
    text = clock + ' · ' + Math.max(1, Math.round(seconds / 60)) + ' phút · ' + formatDistance(remainM);
  } else {
    text = navFailed ? 'Chưa có tuyến, đang thử lại' : 'Đang tính tuyến…';
  }
  document.getElementById('nav-bar-text').textContent = text;
}

// Dòng khoảng cách trong khung chi tiết địa điểm
function renderPlaceInfo(message) {
  if (!currentPlace) return;
  const here = lastPoint ? formatDistance(distanceM(lastPoint.lat, lastPoint.lon, currentPlace.lat, currentPlace.lon)) : '';
  let extra = here;
  if (navRoute) extra = formatDistance(navRoute.total) + ' · ' + Math.max(1, Math.round(navRoute.duration / 60)) + ' phút';
  document.getElementById('place-detail-info').textContent = [message || extra, currentPlace.detail].filter(Boolean).join(' · ');
}

  const liked = (placeSaved().favorites || []).some(o => samePlace(o, currentPlace));
  document.getElementById('place-like').textContent = liked ? '♥' : '♡';
}

function setRouteLine(coordinates) {
  const source = map && map.getSource('nav-route');
  if (source) source.setData(coordinates ? { type: 'Feature', geometry: { type: 'LineString', coordinates } } : { type: 'FeatureCollection', features: [] });
}

function showGuidance(angle, dist, name) {

  box.dataset.angle = angle;
  // Thu nhỏ khi xoay để mũi tên nằm ngang không chạm chữ

  box.classList.remove('hidden');
  document.getElementById('junction').classList.add('hidden');

  box.querySelector('svg').style.transform = '';
