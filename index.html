<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Xe Mazda — Bản đồ + Video</title>

<!-- MapLibre (bản đồ 3D) — chạy local để không bị ad blocker chặn CDN -->
<link rel="stylesheet" href="maplibre-gl.css" />
<script src="maplibre-gl.js"></script>
<!-- dash.js để phát video DASH không quảng cáo -->
<script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>

<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #2a313a;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #ff4d4d;
    --accent-green: #2ea043;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- Bố cục chia đôi ---------- */
  #app { display: flex; height: 100vh; width: 100vw; }

  /* ===== TRÁI: BẢN ĐỒ ===== */
  #map-pane { position: relative; flex: 1 1 50%; min-width: 0; border-right: 2px solid var(--border); }
  #map { position: absolute; inset: 0; background: #23262f; }
  #nav-arrow { width: 44px; height: 44px; }
  #map .maplibregl-ctrl-attrib { font-size: 10px; background: rgba(14,17,22,0.7); color: var(--muted); }
  #map .maplibregl-ctrl-attrib a { color: var(--muted); }

  #map-tools {
    position: absolute; z-index: 1000; top: 10px; right: 10px;
    display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px;
  }
  .map-btn {
    background: rgba(22,27,34,0.92); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 18px; cursor: pointer;
  }
  #btn-sound.active { background: var(--accent-green); color: #fff; }

  #gps-status {
    position: absolute; z-index: 1000; left: 10px; bottom: 10px;
    background: rgba(22,27,34,0.9); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted);
    max-width: 70%;
  }

  /* Bảng tốc độ nổi trên bản đồ. Đặt bên phải vì trên CarPlay mép trái trang có thể bị thanh ứng dụng che */
  #speed-overlay {
    position: absolute; z-index: 1000; top: 10px; right: 122px;
    display: flex; gap: 6px;
  }
  .speed-card {
    background: rgba(14,17,22,0.92); border: 1px solid var(--border);
    border-radius: 10px; padding: 3px; text-align: center; min-width: 52px;
    display: flex; align-items: center; justify-content: center;
  }
  .speed-card .value { font-size: 28px; font-weight: 700; line-height: 1; }

  /* Biển giới hạn tốc độ (hình tròn đỏ) */
  #speed-limit-box .value {
    display: inline-block; width: 44px; height: 44px; line-height: 36px;
    border: 4px solid #e11d2e; border-radius: 50%;
    background: #fff; color: #111; font-size: 19px; font-weight: 800;
  }
  #speed-limit-box.unknown .value { color: #999; font-size: 16px; }
  #speed-limit-box.estimated .value { color: #777; border-color: #999; font-size: 15px; }

  /* Tốc độ hiện tại */
  #current-speed-box .value { color: #7ee787; }
  #current-speed-box.over .value { color: #ff4d4d; }

  /* Cảnh báo chạy quá tốc độ */
  #warning {
    position: absolute; z-index: 1001; top: 68px; left: 60%; white-space: nowrap;
    transform: translateX(-50%);
    background: var(--accent); color: #fff; font-weight: 800; font-size: 18px;
    padding: 6px 14px; border-radius: 10px;
    animation: blink 0.6s steps(2, start) infinite;
  }
  #warning.hidden { display: none; }
  @keyframes blink { 50% { opacity: 0.35; } }

  /* ===== PHẢI: NHẠC ===== */
  #music-pane {
    position: relative;
    flex: 1 1 50%; min-width: 0;
    display: flex; flex-direction: column; background: var(--panel);
  }
  #music-pane .head {
    padding: 6px 8px; border-bottom: 1px solid var(--border);
    font-size: 20px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .expand-btn {
    flex: 0 0 auto; font-size: 14px; padding: 8px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap;
  }

  .search-bar { position: relative; display: flex; gap: 6px; padding: 6px 8px; }
  /* iPhone trên xe hiển thị trang ở mức 70% và tự phóng to nếu chữ trong ô nhập dưới khoảng 23px.
     Nên giữ cỡ chữ 26px rồi thu nhỏ cả ô bằng transform, nhìn như chữ 17px. */
  .search-field { flex: 1; min-width: 0; height: 36px; }
  #search-input {
    display: block; width: 153.85%; height: 153.85%;
    transform: scale(0.65); transform-origin: 0 0;
    font-size: 26px; padding: 2px 15px;
    background: var(--bg); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 15px; outline: none;
  }
  #search-btn {
    font-size: 16px; padding: 8px 14px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-weight: 700; cursor: pointer;
  }
  #search-history {
    position: absolute; z-index: 20; top: 100%; left: 8px; right: 8px;
    display: none; max-height: 190px; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  }
  #search-history.show { display: block; }
  #search-history button {
    display: block; width: 100%; padding: 9px 12px; cursor: pointer; text-align: left;
    font-size: 15px; color: var(--text); background: none; border: none;
    border-bottom: 1px solid var(--border);
  }

  #now-playing { position: relative; display: none; }
  #now-playing.show { display: block; }
  /* Tên bài chỉ hiện nhỏ trên video khi rê chuột hoặc chạm vào */
  .np-card {
    position: absolute; z-index: 2; top: 4px; left: 12px; right: 12px;
    display: flex; gap: 8px; align-items: center;
    background: rgba(14,17,22,0.85); border-radius: 8px; padding: 3px 6px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #now-playing.info .np-card { opacity: 1; pointer-events: auto; }
  .np-card img { width: 26px; height: 26px; border-radius: 4px; object-fit: cover; background: #222; }
  .np-info { flex: 1; min-width: 0; }
  .np-info .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-info .a { display: none; }
  .np-card .fav { font-size: 20px; padding: 2px 4px; }
  #video { display: block; width: 100%; border-radius: 10px; background: #000; }

  /* Đang xem video: video chiếm hết chỗ, danh sách ẩn */
  #app.video-view #result-tabs,
  #app.video-view #results { display: none; }
  #app.video-view #now-playing.show { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 8px 8px; }
  #app.video-view #video { flex: 1; min-height: 0; }

  /* Đang xem danh sách: video thu nhỏ ở góc, chạm vào để quay lại */
  #app.list-view #now-playing.show {
    position: absolute; z-index: 5; right: 20px; bottom: 8px; width: 150px; cursor: pointer;
    border: 2px solid var(--accent); border-radius: 12px;
  }
  #app.list-view #video { pointer-events: none; aspect-ratio: 16 / 9; }
  #app.list-view .np-card { display: none; }
  #app.list-view #results { padding-bottom: 100px; }

  #results {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px 20px;
    scrollbar-color: #6a6e7c transparent;
  }
  #results::-webkit-scrollbar { width: 12px; }
  #results::-webkit-scrollbar-thumb { background: #6a6e7c; border-radius: 6px; }
  .song {
    display: flex; gap: 10px; align-items: center; padding: 5px;
    border-radius: 10px; cursor: pointer; border: 1px solid transparent;
  }
  .song:hover, .song.playing { background: var(--bg); border-color: var(--accent); }
  .song img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: #222; flex: 0 0 44px; }
  .song .meta { flex: 1; min-width: 0; }
  .song .t { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .a { font-size: 13px; color: var(--muted); }
  .song .d { font-size: 13px; color: var(--muted); flex: 0 0 auto; }

  .hint { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 16px; }
  .err { color: #ff9a9a; text-align: center; padding: 20px; font-size: 15px; }

  .head-buttons { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .fav {
    flex: 0 0 auto; background: none; border: none; cursor: pointer;
    color: #f5c518; font-size: 26px; line-height: 1; padding: 6px 8px;
  }

  #result-tabs { display: flex; gap: 6px; padding: 2px 8px 0; }
  #result-tabs button {
    flex: 1; font-size: 14px; padding: 7px 4px; cursor: pointer;
    background: var(--bg); color: var(--muted);
    border: 1px solid var(--border); border-radius: 8px;
  }
  #result-tabs button.active { color: var(--text); border-color: var(--accent); }
  #result-tabs .scroll-btn { flex: 0 0 44px; color: var(--text); }

  .drive-buttons { display: flex; flex: 0 0 auto; gap: 8px; }
  .drive-buttons button {
    width: 48px; height: 40px; font-size: 20px; cursor: pointer;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
  }

  /* Chế độ phóng to */
  #app.focus-map #music-pane { display: none; }
  #app.video-focus #music-pane .search-bar,
  #app.video-focus #music-pane #results,
  #app.video-focus #result-tabs,
  #app.video-focus .np-card { display: none; }
  #app.video-focus #now-playing.show { flex: 1; display: flex; flex-direction: column; padding: 8px; }
  #app.video-focus #video { flex: 1; max-height: none; }

  /* Dọc (điện thoại test): xếp chồng */
  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #map-pane { flex: 1 1 55%; border-right: none; border-bottom: 2px solid var(--border); }
    #music-pane { flex: 1 1 45%; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ================= TRÁI: BẢN ĐỒ ================= -->
  <section id="map-pane">
    <div id="map"></div>

    <div id="speed-overlay">
      <div class="speed-card" id="speed-limit-box">
        <div class="value" id="speed-limit">--</div>
      </div>
      <div class="speed-card" id="current-speed-box">
        <div class="value" id="current-speed">--</div>
      </div>
    </div>

    <div id="warning" class="hidden">⚠️ CHẠY QUÁ TỐC ĐỘ</div>

    <div id="map-tools">
      <button class="map-btn" id="btn-sound" title="Bật / tắt tiếng cảnh báo">🔔</button>
      <button class="map-btn" id="btn-expand-map" title="Phóng to bản đồ">⛶</button>
    </div>
    <div id="gps-status">Đang khởi động…</div>
  </section>

  <!-- ================= PHẢI: NHẠC ================= -->
  <section id="music-pane">
    <div class="head">
      <div class="drive-buttons">
        <button id="btn-prev" title="Video trước">⏮</button>
        <button id="btn-playpause" title="Phát / Tạm dừng">⏯</button>
        <button id="btn-next" title="Video sau">⏭</button>
      </div>
      <div class="head-buttons">
        <button class="expand-btn" id="btn-list" title="Xem danh sách video">☰ Danh sách</button>
        <button class="expand-btn" id="btn-expand-music" title="Phóng to video">⛶ Phóng to</button>
      </div>
    </div>

    <div class="search-bar">
      <div class="search-field"><input id="search-input" type="text" placeholder="Tìm video / bài hát…" /></div>
      <button id="search-btn">Tìm</button>
      <div id="search-history"></div>
    </div>

    <div id="now-playing">
      <div class="np-card">
        <img id="np-thumb" alt="" />
        <div class="np-info">
          <div class="t" id="np-title">—</div>
          <div class="a" id="np-artist">—</div>
        </div>
        <button class="fav" id="np-fav" title="Yêu thích">☆</button>
      </div>
      <video id="video" controls playsinline></video>
    </div>

    <div id="result-tabs">
      <button data-tab="search" class="active">Kết quả</button>
      <button data-tab="favorites">★ Yêu thích</button>
      <button data-tab="history">Đã xem</button>
      <button class="scroll-btn" id="btn-scroll-up" title="Cuộn lên">▲</button>
      <button class="scroll-btn" id="btn-scroll-down" title="Cuộn xuống">▼</button>
    </div>

    <div id="results"><div class="hint">Gõ tên video rồi bấm “Tìm”</div></div>
  </section>

</div>

<script>
/* ============================================================
   CẤU HÌNH — sửa ở đây nếu cần
   ============================================================ */
// Các instance Invidious (frontend YouTube không quảng cáo).
// Nếu cái đầu hỏng, tự thử cái sau. Khi mở trang sẽ tự lấy thêm từ INSTANCE_LIST_URL.
const INVIDIOUS_INSTANCES = [
  'https://yt.chocolatemoo53.com',
  'https://inv.nadeko.net'
];
const INSTANCE_LIST_URL = 'https://api.invidious.io/instances.json';
const ROAD_DATA_URL = 'data/roads/';
const DEFAULT_CENTER = [108.0, 16.05]; // Việt Nam (khi chưa có GPS), thứ tự kinh độ, vĩ độ
const MAP_TILES_URL = 'https://tiles.openfreemap.org/planet';
const MAP_FONTS_URL = 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf';
const NAV_ZOOM = 17;           // mức phóng khi dẫn đường
const NAV_MIN_ZOOM = 14;       // thu nhỏ quá mức này thì lần cập nhật GPS sau tự phóng lại
const NAV_PITCH = 60;          // độ nghiêng bản đồ
const NAV_TOP_PADDING = 0.45;  // phần trên màn hình dành cho đường phía trước, mũi tên nằm ở dưới
const NAV_MOVE_MS = 1000;      // thời gian trượt giữa hai lần cập nhật GPS
const FOLLOW_RESUME_MS = 10000; // kéo bản đồ xong, sau bấy nhiêu lâu thì tự quay về xe
const HEADING_MIN_KMH = 4;     // chậm hơn mức này thì hướng GPS nhiễu, giữ hướng cũ

// Số ước tính khi đường không có dữ liệu maxspeed. Chỉ để tham khảo, không kích hoạt cảnh báo.
const ESTIMATED_LIMITS = {
  motorway: 100, trunk: 80, primary: 60, secondary: 60, tertiary: 50,
  unclassified: 50, residential: 50, living_street: 30
};
// ROAD_TILE_DEG và ROAD_TYPES phải giống TILE_DEG và ROAD_TYPES trong tools/build_roads.py
const ROAD_TILE_DEG = 0.1;
const ROAD_TYPES = ['motorway', 'trunk', 'primary', 'secondary', 'tertiary',
                    'unclassified', 'residential', 'living_street'];
const ROAD_TILE_EDGE_M = 1500; // còn cách ranh giới ô từng này thì tải trước ô bên cạnh
const ROAD_TILES_IN_MEMORY = 9;
const ROAD_MATCH_M = 35;      // đường xa hơn khoảng này thì không tính
const LIMIT_STALE_MS = 30000;  // giữ giới hạn cũ tối đa bao lâu khi không khớp đường
const VIDEO_START_TIMEOUT_MS = 25000; // quá thời gian này chưa có hình thì thử lại
const VIDEO_TRIES_PER_SERVER = 3;     // mỗi máy chủ được thử tối đa bấy nhiêu lần cho một video
const API_TRIES = 3;                  // máy chủ quá tải hay báo lỗi thoáng qua, nên thử lại vài lần
const API_RETRY_MS = 1500;
const MAX_AUTO_SKIPS = 3;             // tự bỏ qua tối đa bấy nhiêu video lỗi liên tiếp rồi mới báo
const TRACK_CHANGE_DELAY_MS = 400;    // bấm chuyển bài liên tiếp thì chỉ tải bài cuối, đỡ quá tải máy chủ
const VIDEO_MAX_HEIGHT = 480;         // nửa màn hình xe không cần nét hơn, tải nhẹ thì đỡ giật
const VIDEO_BUFFER_S = 45;            // tải trước bấy nhiêu giây để đỡ qua lúc mạng yếu

/* ============================================================
   BẢN ĐỒ
   ============================================================ */
// Kiểu bản đồ tối giống app dẫn đường, chỉ vẽ những lớp cần để đỡ nặng máy
const ROAD_CLASSES = ['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor', 'service'];
const MAIN_ROAD_CLASSES = ['motorway', 'trunk', 'primary'];
const isMainRoad = ['match', ['get', 'class'], MAIN_ROAD_CLASSES, true, false];
function roadWidth(scale) {
  const byClass = (main, other) => ['case', isMainRoad, main * scale, other * scale];
  return ['interpolate', ['exponential', 1.5], ['zoom'], 10, byClass(1.5, 0.5), 14, byClass(5, 2), 18, byClass(30, 16)];
}
const NAV_MAP_STYLE = {
  version: 8,
  glyphs: MAP_FONTS_URL,
  sources: { osm: { type: 'vector', url: MAP_TILES_URL } },
  layers: [
    { id: 'background', type: 'background', paint: { 'background-color': '#23262f' } },
    { id: 'water', type: 'fill', source: 'osm', 'source-layer': 'water', paint: { 'fill-color': '#161a24' } },
    { id: 'road-edge', type: 'line', source: 'osm', 'source-layer': 'transportation',
      filter: ['in', ['get', 'class'], ['literal', ROAD_CLASSES]],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#6a6e7c', 'line-width': roadWidth(1.25) } },
    { id: 'road', type: 'line', source: 'osm', 'source-layer': 'transportation',
      filter: ['in', ['get', 'class'], ['literal', ROAD_CLASSES]],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': ['case', isMainRoad, '#565a68', '#3c3f4b'], 'line-width': roadWidth(1) } },
    { id: 'building', type: 'fill-extrusion', source: 'osm', 'source-layer': 'building', minzoom: 15,
      paint: {
        'fill-extrusion-color': '#343746',
        'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 6],
        'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
        'fill-extrusion-opacity': 0.9
      } },
    { id: 'road-name', type: 'symbol', source: 'osm', 'source-layer': 'transportation_name', minzoom: 12,
      layout: {
        'symbol-placement': 'line',
        'text-field': ['coalesce', ['get', 'name'], ['get', 'ref'], ''],
        'text-font': ['Noto Sans Regular'],
        'text-size': ['interpolate', ['linear'], ['zoom'], 12, 11, 17, 16],
        'text-pitch-alignment': 'viewport',
        'symbol-spacing': 220
      },
      paint: { 'text-color': '#eceef4', 'text-halo-color': '#23262f', 'text-halo-width': 1.5 } },
    { id: 'place-name', type: 'symbol', source: 'osm', 'source-layer': 'place', maxzoom: 14,
      layout: { 'text-field': ['coalesce', ['get', 'name'], ''], 'text-font': ['Noto Sans Regular'], 'text-size': 14 },
      paint: { 'text-color': '#aeb3c2', 'text-halo-color': '#23262f', 'text-halo-width': 1.5 } }
  ]
};

let map = null;
try {
  map = new maplibregl.Map({
    container: 'map',
    style: NAV_MAP_STYLE,
    center: DEFAULT_CENTER,
    zoom: 5,
    pixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),  // đủ nét, đỡ nặng khi đang phát video
    attributionControl: false
  });
  // giấy phép dữ liệu yêu cầu ghi nguồn
  map.addControl(new maplibregl.AttributionControl({ compact: false }), 'bottom-right');
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
} catch (e) {
  map = null;
  document.getElementById('map').innerHTML =
    '<div style="color:#ff9a9a;padding:20px;font-size:16px;">⚠️ Không mở được bản đồ (thiết bị cần hỗ trợ WebGL). Giới hạn tốc độ vẫn hoạt động nếu có GPS.</div>';
}

let navArrow = null;        // mũi tên vị trí hiện tại (GPS)
let carPos = null;          // vị trí và hướng mới nhất từ GPS
let manualMarker = null;    // vị trí đặt tay
let follow = true;          // tự động bám theo GPS
let speedLimit = null;      // giới hạn tốc độ đã biết chắc (số ước tính không tính)
let lastBeep = 0;

// Kéo bản đồ để xem chỗ khác thì tạm thôi bám theo, một lúc sau tự quay về xe
let followTimer = null;
if (map) {
  map.on('dragstart', function () {
    follow = false;
    clearTimeout(followTimer);
  });
  map.on('dragend', function () {
    followTimer = setTimeout(function () {
      follow = true;
      moveCamera(false);
    }, FOLLOW_RESUME_MS);
  });
}

/* ---------- GPS ---------- */
function setStatus(msg) { document.getElementById('gps-status').textContent = msg; }

function startGPS() {
  if (!('geolocation' in navigator)) {
    setStatus('⚠️ Trình duyệt không hỗ trợ GPS — chạm vào bản đồ để đặt vị trí');
    return;
  }
  setStatus('Đang tìm GPS… (cần mở trang qua HTTPS)');
  navigator.geolocation.watchPosition(onPosition, onGPSError, {
    enableHighAccuracy: true, maximumAge: 2000, timeout: 15000
  });
}

// Khoảng cách (m) giữa hai điểm, đủ chính xác cho quãng ngắn
function distanceM(lat1, lon1, lat2, lon2) {
  const dy = (lat2 - lat1) * 111320;
  const dx = (lon2 - lon1) * 111320 * Math.cos(lat1 * Math.PI / 180);
  return Math.hypot(dx, dy);
}
function bearingDeg(lat1, lon1, lat2, lon2) {
  const dy = lat2 - lat1;
  const dx = (lon2 - lon1) * Math.cos(lat1 * Math.PI / 180);
  return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
}

// Máy không báo tốc độ / hướng thì tự tính từ hai vị trí liên tiếp
let lastFix = null;
let lastHeading = null;
function readMotion(pos) {
  const c = pos.coords;
  // Có máy báo số âm thay cho "không biết"
  let kmh = (c.speed != null && c.speed >= 0) ? c.speed * 3.6 : null;
  let heading = (c.heading != null && c.heading >= 0) ? c.heading : null;
  if (lastFix) {
    const dt = (pos.timestamp - lastFix.time) / 1000;
    const dist = distanceM(lastFix.lat, lastFix.lon, c.latitude, c.longitude);
    if (kmh == null && dt >= 1 && c.accuracy <= 30) kmh = (dist < 5) ? 0 : dist / dt * 3.6;
    if (heading == null && dist >= 10) heading = bearingDeg(lastFix.lat, lastFix.lon, c.latitude, c.longitude);
  }
  if (!lastFix || distanceM(lastFix.lat, lastFix.lon, c.latitude, c.longitude) >= 5 || pos.timestamp - lastFix.time > 5000) {
    lastFix = { lat: c.latitude, lon: c.longitude, time: pos.timestamp };
  }
  if (heading != null && !(kmh != null && kmh < HEADING_MIN_KMH)) lastHeading = heading;
  return { kmh, heading: lastHeading };
}

function onPosition(pos) {
  if (!map) return;
  const lat = pos.coords.latitude, lon = pos.coords.longitude;
  const { kmh, heading } = readMotion(pos);

  const moved = !carPos || distanceM(carPos.lat, carPos.lon, lat, lon) >= 1 || carPos.heading !== heading;
  carPos = { lat, lon, heading };
  if (!navArrow) navArrow = createNavArrow();
  if (follow) {
    if (moved) moveCamera(false);     // đứng yên thì không vẽ lại, đỡ nặng máy
  } else {
    placeArrow(lon, lat, heading || 0);
  }

  setStatus('GPS: ' + lat.toFixed(5) + ', ' + lon.toFixed(5));
  lookupSpeedLimit(lat, lon, heading);
  renderCurrentSpeed(kmh);
}

function createNavArrow() {
  const el = document.createElement('div');
  el.id = 'nav-arrow';
  el.innerHTML = '<svg viewBox="0 0 44 44" width="44" height="44">' +
    '<path d="M22 3 L39 39 L22 31 L5 39 Z" fill="#2f8cff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>';
  return new maplibregl.Marker({ element: el, rotationAlignment: 'map', pitchAlignment: 'map' })
    .setLngLat([carPos.lon, carPos.lat]).addTo(map);
}
function placeArrow(lon, lat, rotation) {
  navArrow.setLngLat([lon, lat]).setRotation(rotation);
}

// Đưa camera về sau xe: nghiêng, xoay theo hướng chạy, xe nằm phía dưới màn hình
function moveCamera(instant) {
  if (!map || !follow || !carPos) return;
  const camera = {
    center: [carPos.lon, carPos.lat],
    pitch: NAV_PITCH,
    padding: { top: map.getContainer().clientHeight * NAV_TOP_PADDING, bottom: 0, left: 0, right: 0 },
    duration: instant ? 0 : NAV_MOVE_MS,
    easing: function (t) { return t; },
    essential: true
  };
  if (carPos.heading != null) camera.bearing = carPos.heading;
  if (map.getZoom() < NAV_MIN_ZOOM) {
    camera.zoom = NAV_ZOOM;
    camera.duration = 0;
  }
  map.easeTo(camera);
}
// Khung bản đồ đổi kích thước thì cập nhật ngay, nếu không mũi tên sẽ lệch khỏi giữa
if (map) new ResizeObserver(function () {
  map.resize();
  moveCamera(true);
}).observe(map.getContainer());

// Mũi tên trượt cùng camera nên luôn đứng giữa và chỉ thẳng lên trên
if (map) map.on('move', function () {
  if (!follow || !navArrow) return;
  const c = map.getCenter();
  placeArrow(c.lng, c.lat, map.getBearing());
});

function onGPSError(err) {
  setStatus('⚠️ Không lấy được GPS — chạm vào bản đồ để đặt vị trí');
}

/* ---------- Đặt vị trí tay (chạm vào bản đồ) ---------- */
if (map) map.on('click', function (e) {
  const { lat, lng } = e.lngLat;
  if (manualMarker) manualMarker.setLngLat([lng, lat]);
  else manualMarker = new maplibregl.Marker({ color: '#ff4d4d' }).setLngLat([lng, lat]).addTo(map);
  setStatus('Vị trí đặt tay: ' + lat.toFixed(5) + ', ' + lng.toFixed(5));
  lastLimitAt = 0;             // đặt tay là nhảy sang chỗ khác, không giữ số cũ
  currentWayId = null;
  lookupSpeedLimit(lat, lng, null);
});

/* ---------- Dữ liệu đường ----------
   Đọc từ các file có sẵn trong ROAD_DATA_URL (tạo bằng tools/build_roads.py),
   mỗi file là một ô lưới. Tìm đường ngay trong máy, không cần hỏi máy chủ. */
const roadTiles = new Map();    // 'x_y' -> các đoạn đường của ô đó
const tilesLoading = new Set();
const tileRetryAt = new Map();  // tải lỗi thì chờ đến lúc này mới thử lại
let lastPoint = null;

// Ô chứa vị trí hiện tại, thêm ô bên cạnh nếu đã gần ranh giới
function tilesNear(lat, lon) {
  const dLat = ROAD_TILE_EDGE_M / 111320;
  const dLon = dLat / Math.cos(lat * Math.PI / 180);
  const keys = new Set();
  for (const a of [-dLat, 0, dLat]) {
    for (const b of [-dLon, 0, dLon]) {
      keys.add(Math.floor((lon + b) / ROAD_TILE_DEG) + '_' + Math.floor((lat + a) / ROAD_TILE_DEG));
    }
  }
  return Array.from(keys);
}

function decodeWay(record, index, key) {
  const [name, type, oneway, limitForward, limitBackward, coords] = record;
  const points = [];
  let lat = 0, lon = 0;
  for (let i = 0; i + 1 < coords.length; i += 2) {
    lat += coords[i];
    lon += coords[i + 1];
    points.push([lat / 1e5, lon / 1e5]);
  }
  return {
    id: key + ':' + index,
    name,
    oneway: oneway > 0,
    reversed: oneway === 2,
    limitForward,
    limitBackward,
    estimate: ESTIMATED_LIMITS[ROAD_TYPES[type]] || null,
    points
  };
}

async function loadTile(key) {
  tilesLoading.add(key);
  try {
    const r = await fetchWithTimeout(ROAD_DATA_URL + key + '.json', 20000);
    if (r.status !== 404 && !r.ok) throw new Error('HTTP ' + r.status);
    // 404 = ô không có đường nào (biển, ngoài Việt Nam)
    const records = (r.status === 404) ? [] : await r.json();
    roadTiles.set(key, records.map((rec, i) => decodeWay(rec, i, key)));
    tileRetryAt.delete(key);
    // Giữ bộ nhớ gọn: bỏ các ô cũ không còn ở gần
    const near = lastPoint ? tilesNear(lastPoint.lat, lastPoint.lon) : [];
    for (const k of roadTiles.keys()) {
      if (roadTiles.size <= ROAD_TILES_IN_MEMORY) break;
      if (!near.includes(k)) roadTiles.delete(k);
    }
  } catch (e) {
    tileRetryAt.set(key, Date.now() + 20000);
  }
  tilesLoading.delete(key);
  if (lastPoint) updateLimitFromRoads(lastPoint.lat, lastPoint.lon, lastPoint.heading);
}

// Tìm đường đang chạy: gần vị trí nhất và cùng hướng với xe
function matchRoad(lat, lon, heading) {
  const cosLat = Math.cos(lat * Math.PI / 180);
  let best = null;
  for (const key of tilesNear(lat, lon)) {
    for (const way of roadTiles.get(key) || []) {
      for (let i = 0; i + 1 < way.points.length; i++) {
        const a = way.points[i], b = way.points[i + 1];
        const ax = (a[1] - lon) * 111320 * cosLat, ay = (a[0] - lat) * 111320;
        const bx = (b[1] - lon) * 111320 * cosLat, by = (b[0] - lat) * 111320;
        const sx = bx - ax, sy = by - ay;
        const len2 = sx * sx + sy * sy;
        if (!len2) continue;
        const u = Math.max(0, Math.min(1, -(ax * sx + ay * sy) / len2));
        const dist = Math.hypot(ax + u * sx, ay + u * sy);
        if (dist > ROAD_MATCH_M) continue;

        let score = dist;
        let forward = true;
        if (heading != null) {
          const segBearing = (Math.atan2(sx, sy) * 180 / Math.PI + 360) % 360;
          let diff = Math.abs(segBearing - heading) % 360;
          if (diff > 180) diff = 360 - diff;
          forward = diff <= 90;
          // Đường hai chiều: đi hướng nào cũng khớp. Một chiều: đi ngược thì bị trừ điểm.
          const allowedDiff = way.oneway ? (way.reversed ? 180 - diff : diff) : Math.min(diff, 180 - diff);
          score += allowedDiff * 0.5;
        }
        if (way.id === currentWayId) score -= 8;   // đừng nhảy qua lại giữa hai đường sát nhau
        if (!best || score < best.score) best = { way, forward, score };
      }
    }
  }
  return best;
}

let currentWayId = null;
let lastLimitAt = 0;          // lần cuối xác định được đường đang chạy

function updateLimitFromRoads(lat, lon, heading) {
  const match = matchRoad(lat, lon, heading);
  if (match) {
    const way = match.way;
    const known = match.forward ? way.limitForward : way.limitBackward;
    currentWayId = way.id;
    lastLimitAt = Date.now();
    if (known) renderSpeedLimit(known, false);
    else renderSpeedLimit(way.estimate, true);
    if (way.name) setStatus(way.name);
  } else {
    if (Date.now() - lastLimitAt > LIMIT_STALE_MS) {
      currentWayId = null;
      renderSpeedLimit(null, false);
    }
    if (tilesNear(lat, lon).some(k => tileRetryAt.has(k))) {
      setStatus('⚠️ Chưa tải được dữ liệu đường, đang thử lại…');
    }
  }
}

function lookupSpeedLimit(lat, lon, heading) {
  lastPoint = { lat, lon, heading };
  for (const key of tilesNear(lat, lon)) {
    if (roadTiles.has(key) || tilesLoading.has(key)) continue;
    if (Date.now() < (tileRetryAt.get(key) || 0)) continue;
    loadTile(key);
  }
  updateLimitFromRoads(lat, lon, heading);
}

// estimated = số ước tính theo loại đường: chỉ hiện để tham khảo, không cảnh báo
function renderSpeedLimit(limit, estimated) {
  speedLimit = (limit && !estimated) ? limit : null;
  const el = document.getElementById('speed-limit');
  const box = document.getElementById('speed-limit-box');
  el.textContent = limit ? (estimated ? '~' + limit : limit) : '--';
  box.classList.toggle('unknown', !limit);
  box.classList.toggle('estimated', !!limit && !!estimated);
}

/* ---------- Hiển thị tốc độ + cảnh báo ---------- */
function renderCurrentSpeed(kmh) {
  const el = document.getElementById('current-speed');
  const box = document.getElementById('current-speed-box');
  const warn = document.getElementById('warning');
  if (kmh == null) {
    el.textContent = '--';
    box.classList.remove('over');
    warn.classList.add('hidden');
    return;
  }
  el.textContent = Math.round(kmh);

  const over = (speedLimit != null && kmh > speedLimit + 5);
  box.classList.toggle('over', over);
  if (over) {
    warn.classList.remove('hidden');
    const now = Date.now();
    if (soundOn && now - lastBeep > 4000) { lastBeep = now; beep(); }
  } else {
    warn.classList.add('hidden');
  }
}

/* ---------- Tiếng "bíp" cảnh báo (không cần file) ---------- */
let audioCtx = null;
let soundOn = true;
try { soundOn = localStorage.getItem('mazda_sound') !== 'off'; } catch (e) {}

// Chỉ mở AudioContext lúc cần kêu rồi đóng ngay: để nó chạy song song với video
// có thể làm tiếng video bị hụt trên iPhone.
let audioCloseTimer = null;
function closeAudio() {
  if (audioCtx) audioCtx.close();
  audioCtx = null;
}

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep() {
  try {
    ensureAudio();
    const t = audioCtx.currentTime;
    for (let i = 0; i < 3; i++) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t + i * 0.25);
      g.gain.exponentialRampToValueAtTime(0.3, t + i * 0.25 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.25 + 0.22);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + i * 0.25); o.stop(t + i * 0.25 + 0.22);
    }
    clearTimeout(audioCloseTimer);
    audioCloseTimer = setTimeout(closeAudio, 1000);
  } catch (e) {}
}

const videoEl = document.getElementById('video');

let lastTimeSave = 0;
let playToken = 0;          // mỗi lần phát có số riêng, để bỏ qua kết quả của lần phát cũ
let startupTimer = null;
let currentItem = null;
let resultsTab = 'search';
let lastSearchItems = [];
const STORAGE_KEY = 'mazda_video_state';
const GOOD_INSTANCE_KEY = 'mazda_good_instance';
const FAVORITES_KEY = 'mazda_favorites';
const HISTORY_KEY = 'mazda_history';

const SEARCH_HISTORY_KEY = 'mazda_search_history';
const SEARCH_HISTORY_MAX = 8;

const NP_INFO_MS = 3000;     // tên bài hiện bao lâu sau lần rê chuột hoặc chạm cuối

function fetchWithTimeout(url, ms = 9000) {
  if (typeof AbortController !== 'undefined') {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms);
    return fetch(url, { signal: c.signal }).finally(() => clearTimeout(t));
  }
  return fetch(url);
}

// Danh sách instance, cái vừa chạy tốt lần trước được xếp lên đầu
let instances = INVIDIOUS_INSTANCES.slice();
try {
  const good = localStorage.getItem(GOOD_INSTANCE_KEY);
  if (good) instances = [good].concat(instances.filter(x => x !== good));
} catch (e) {}

function markInstanceGood(base) {
  instances = [base].concat(instances.filter(x => x !== base));
  try { localStorage.setItem(GOOD_INSTANCE_KEY, base); } catch (e) {}
}

// Lấy thêm instance mới từ danh sách công khai (chỉ cái có API và cho phép CORS)
async function refreshInstances() {
  try {
    const r = await fetchWithTimeout(INSTANCE_LIST_URL);
    const list = await r.json();
    const found = list
      .filter(([, i]) => i.type === 'https' && i.api && i.cors)
      .map(([, i]) => i.uri.replace(/\/$/, ''));
    instances = Array.from(new Set(instances.concat(found)));
  } catch (e) {}
}

// Gọi API Invidious, tự thử lần lượt các instance (bỏ qua những cái trong skip), hết lượt thì thử lại.
// isCurrent trả về false nghĩa là kết quả không còn cần nữa, ví dụ đã chuyển sang bài khác.
async function invidiousFetch(path, skip, isCurrent) {
  let lastErr;
  for (let attempt = 0; attempt < API_TRIES; attempt++) {
    if (attempt > 0) await new Promise(done => setTimeout(done, API_RETRY_MS));
    for (const base of instances.slice()) {
      if (skip && skip.has(base)) continue;
      if (isCurrent && !isCurrent()) throw new Error('Không còn cần');
      try {
        const r = await fetchWithTimeout(base + path);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        markInstanceGood(base);
        return { data, base };
      } catch (e) { lastErr = e; }
    }
  }
  throw lastErr || new Error('Không kết nối được Invidious');
}

// Lấy ảnh thumbnail (ưu tiên ảnh từ API, nếu không có thì dùng YouTube)
function getThumb(item, videoId) {
  const arr = item && item.videoThumbnails;
  if (arr && arr.length) return arr[arr.length - 1].url;
  return 'https://i.ytimg.com/vi/' + videoId + '/mqdefault.jpg';
}

function extractVideoId(url) {
  const m = url && url.match(/[?&]v=([A-Za-z0-9_-]{11})/);
  return m ? m[1] : url;
}

function fmtDuration(sec) {
  if (!sec || sec < 0) return '';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

async function doSearch(q) {
  setActiveTab('search');
  resultsEl.innerHTML = '<div class="hint">Đang tìm…</div>';
  try {
    const { data } = await invidiousFetch('/api/v1/search?q=' + encodeURIComponent(q) + '&type=video');
    // Video trực tiếp không có luồng DASH nên không phát được, bỏ khỏi kết quả
    lastSearchItems = (Array.isArray(data) ? data : []).filter(x => !x.liveNow && !x.isUpcoming);
    if (resultsTab === 'search') renderResults(lastSearchItems, 'Không có kết quả');
  } catch (e) {
    resultsEl.innerHTML = '<div class="err">Không tìm được. Các máy chủ video đang lỗi, thử lại sau.</div>';
  }
}

/* ---------- Yêu thích + đã xem (lưu trong máy) ---------- */
function loadList(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; }
}
function saveList(key, list) {
  try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {}
}
// Ảnh lấy thẳng từ YouTube vì địa chỉ ảnh của instance có thể chết sau này
function toSavedItem(item) {
  const videoId = item.videoId || extractVideoId(item.url);
  return {
    videoId,
    title: item.title || '',
    author: item.author || '',
    lengthSeconds: item.lengthSeconds || 0,
    videoThumbnails: [{ url: 'https://i.ytimg.com/vi/' + videoId + '/mqdefault.jpg' }]
  };
}
function isFavorite(videoId) {
  return loadList(FAVORITES_KEY).some(x => x.videoId === videoId);
}
function toggleFavorite(item) {
  const saved = toSavedItem(item);
  const list = loadList(FAVORITES_KEY);
  const next = isFavorite(saved.videoId)
    ? list.filter(x => x.videoId !== saved.videoId)
    : [saved].concat(list);
  saveList(FAVORITES_KEY, next);
  renderFavButton();
  if (resultsTab === 'favorites') showTab('favorites');
  else document.querySelectorAll('.song').forEach(el => {
    if (el.dataset.videoId === saved.videoId) {
      el.querySelector('.fav').textContent = isFavorite(saved.videoId) ? '★' : '☆';
    }
  });
}
function addToHistory(item) {
  const saved = toSavedItem(item);
  const list = loadList(HISTORY_KEY).filter(x => x.videoId !== saved.videoId);
  saveList(HISTORY_KEY, [saved].concat(list).slice(0, HISTORY_MAX));
  if (resultsTab === 'history') showTab('history');
}
function renderFavButton() {
  const on = !!currentItem && isFavorite(currentItem.videoId || extractVideoId(currentItem.url));
  document.getElementById('np-fav').textContent = on ? '★' : '☆';
}
function setActiveTab(tab) {
  resultsTab = tab;
  document.querySelectorAll('#result-tabs button[data-tab]').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
}
function showTab(tab) {
  setActiveTab(tab);
  if (tab === 'favorites') renderResults(loadList(FAVORITES_KEY), 'Chưa có video yêu thích. Bấm ☆ để lưu.');
  else if (tab === 'history') renderResults(loadList(HISTORY_KEY), 'Chưa xem video nào');
  else renderResults(lastSearchItems, 'Gõ tên video rồi bấm “Tìm”');
}
document.querySelectorAll('#result-tabs button[data-tab]').forEach(b => {
  b.addEventListener('click', () => showTab(b.dataset.tab));

document.getElementById('np-fav').addEventListener('click', () => {

function renderResults(items, emptyText) {
  if (!items.length) {
    resultsEl.innerHTML = '<div class="hint">' + escapeHtml(emptyText) + '</div>';
    return;
  }
  resultsEl.innerHTML = '';
  items.forEach((item, i) => {
    const videoId = item.videoId || extractVideoId(item.url);
    const d = document.createElement('div');
    d.className = 'song' + (videoId === currentVideoId ? ' playing' : '');
    d.innerHTML =
      '<img src="' + escapeHtml(getThumb(item, videoId)) + '" alt="">' +
      '<div class="meta"><div class="t">' + escapeHtml(item.title || '') + '</div>' +
      '<div class="a">' + escapeHtml(item.author || '') + '</div></div>' +
      '<div class="d">' + fmtDuration(item.lengthSeconds) + '</div>' +
      '<button class="fav" title="Yêu thích">' + (isFavorite(videoId) ? '★' : '☆') + '</button>';
    d.dataset.videoId = videoId;
    d.addEventListener('click', () => {
      queue = items.slice();      // hàng đợi = toàn bộ danh sách đang xem
      setListOpen(false);
      playFromQueue(i);
    });
    d.querySelector('.fav').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFavorite(item);
    });
    resultsEl.appendChild(d);
  });
}

function playFromQueue(i) {
  if (i < 0 || i >= queue.length) return;
  clearTimeout(trackChangeTimer);
  queueIndex = i;
  pendingResumeTime = 0;      // chuyển bài thì không tua tới chỗ đang xem dở của bài cũ
  playSong(queue[i]);
}

// step = 1 là bài sau, -1 là bài trước
let trackChangeTimer = null;
function changeTrack(step) {
  // Mở lại trang và phát tiếp video xem dở thì chưa có hàng đợi, lấy danh sách đang hiện
  if (!queue.length) {
    queue = lastSearchItems.slice();
    queueIndex = -1;
  }
  if (step < 0 && queueIndex <= 0) {
    videoEl.currentTime = 0;
    return;
  }
  if (!queue.length) return;
  let i = (queueIndex + step) % queue.length;   // hết danh sách thì quay lại bài đầu
  const id = queue[i].videoId || extractVideoId(queue[i].url);
  if (id === currentVideoId && queue.length > 1) i = (i + step + queue.length) % queue.length;
  queueIndex = i;
  clearTimeout(trackChangeTimer);
  trackChangeTimer = setTimeout(function () { playFromQueue(i); }, TRACK_CHANGE_DELAY_MS);
}

function clearPlayError() {
  resultsEl.querySelectorAll('.err').forEach(el => el.remove());
}
function showPlayError(msg) {
  clearPlayError();
  resultsEl.insertAdjacentHTML('afterbegin', '<div class="err">' + escapeHtml(msg) + '</div>');
  setListOpen(true);
}

// failCounts = số lần lỗi của từng instance với video này.
// Instance có thể lỗi ngẫu nhiên nên được thử lại vài lần trước khi bỏ qua.
let autoSkips = 0;           // số video lỗi đã tự bỏ qua liên tiếp
async function playSong(item, failCounts) {
  const token = ++playToken;
  const counts = failCounts || new Map();
  const videoId = item.videoId || extractVideoId(item.url);
  const skip = new Set();
  counts.forEach((n, b) => { if (n >= VIDEO_TRIES_PER_SERVER) skip.add(b); });
  stopPlayer();
  try {
    const { data: s, base } = await invidiousFetch('/api/v1/videos/' + videoId, skip, () => token === playToken);
    if (token !== playToken) return;
    if (s.liveNow) {
      showPlayError('Không phát được video trực tiếp.');
      return;
    }
    applyPlayer(s, item, base, counts, token);
  } catch (e) {
    if (token !== playToken) return;
    // Video này không mở được thì tự sang bài sau, lỗi nhiều lần liên tiếp mới báo
    if (queue.length > 1 && autoSkips < MAX_AUTO_SKIPS) {
      autoSkips++;
      changeTrack(1);
    } else {
      autoSkips = 0;
      showPlayError('Không phát được video này trên máy chủ nào. Thử lại sau.');
    }
  }
}

// Áp dụng dữ liệu stream vào trình phát
function applyPlayer(s, item, base, failCounts, token) {
  const videoId = s.videoId || (item.videoId || extractVideoId(item.url));
  currentVideoId = videoId;
  currentItem = Object.assign({}, item, {
    videoId,
    title: item.title || s.title,
    author: item.author || s.author,
    lengthSeconds: item.lengthSeconds || s.lengthSeconds
  });
  renderNowPlaying({
    title: currentItem.title,
    artist: currentItem.author,
    thumb: getThumb(item, videoId)
  });
  renderFavButton();
  markPlaying(videoId);
  addToHistory(currentItem);
  playVideo(s, item, base, failCounts, token);
  saveState();
}

function stopPlayer() {
  clearTimeout(startupTimer);
  if (dashPlayer) { try { dashPlayer.reset(); } catch (e) {} dashPlayer = null; }
}

// Máy yếu và mạng 4G chỉ cần H.264 tới 480p: giải mã bằng phần cứng, tải nhẹ.
// VP9 và AV1 có thể phải giải mã bằng CPU, gây giật.
function isLightTrack(rep) {
  if (String(rep.mimeType).indexOf('audio') === 0) return /mp4a\.40\.2/.test(rep.codecs);  // AAC-LC, bỏ HE-AAC chất lượng thấp
  return /avc1/.test(rep.codecs) && rep.height <= VIDEO_MAX_HEIGHT;
}

function playVideo(s, item, base, failCounts, token) {
  stopPlayer();

  if (!window.dashjs) {
    showPlayError('Không tải được trình phát video (dash.js).');
    return;
  }

  // Lỗi hoặc tải quá lâu: thử lại rồi đổi instance khác, giữ nguyên vị trí đang xem
  let failed = false;
  function failOver() {
    if (failed || token !== playToken) return;
    failed = true;
    failCounts.set(base, (failCounts.get(base) || 0) + 1);
    if (videoEl.currentTime > 0) pendingResumeTime = videoEl.currentTime;
    playSong(item, failCounts);
  }

  if (!s.dashUrl) { failOver(); return; }
  try {
    dashPlayer = dashjs.MediaPlayer().create();
    dashPlayer.registerCustomCapabilitiesFilter(isLightTrack);
    dashPlayer.updateSettings({
      streaming: {
        buffer: {
          stableBufferTime: VIDEO_BUFFER_S,
          bufferTimeAtTopQuality: VIDEO_BUFFER_S,
          bufferTimeAtTopQualityLongForm: VIDEO_BUFFER_S
        }
      }
    });
    startupTimer = setTimeout(failOver, VIDEO_START_TIMEOUT_MS);
    videoEl.addEventListener('canplay', function () {
      if (token !== playToken) return;
      clearTimeout(startupTimer);
      autoSkips = 0;
      clearPlayError();
    }, { once: true });
    // local=true để instance proxy toàn bộ phân đoạn video (URL gốc bị khóa IP)
    dashPlayer.initialize(videoEl, s.dashUrl + '?local=true', true);
    dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function () {
      if (pendingResumeTime > 0) {
        try { videoEl.currentTime = pendingResumeTime; } catch (e) {}
        pendingResumeTime = 0;
      }
    });
    dashPlayer.on(dashjs.MediaPlayer.events.ERROR, failOver);
  } catch (e) {
    failOver();
  }
}

function renderNowPlaying(info) {
  nowPlayingEl.classList.add('show');
  document.getElementById('np-title').textContent = info.title || '—';
  document.getElementById('np-artist').textContent = info.artist || '—';
  document.getElementById('np-thumb').src = info.thumb || '';
  renderRightPane();
  showNowPlayingInfo();
  updateMediaSession(info);
}

/* ---------- Nút trên vô lăng, màn hình khóa ----------
   Các nút này do iPhone gửi tới ứng dụng đang phát qua Media Session. */
function updateMediaSession(info) {
  if (!('mediaSession' in navigator) || !window.MediaMetadata) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: info.title || '',
    artist: info.artist || '',
    artwork: info.thumb ? [{ src: info.thumb }] : []
  });
}
if ('mediaSession' in navigator) {
  const mediaActions = {
    nexttrack: () => changeTrack(1),
    previoustrack: () => changeTrack(-1),
    play: () => videoEl.play().catch(function () {}),
    pause: () => videoEl.pause(),
    // Để trống thì iPhone hiện nút chuyển bài thay vì nút tua
    seekbackward: null,
    seekforward: null
  };
  Object.keys(mediaActions).forEach(action => {
    try { navigator.mediaSession.setActionHandler(action, mediaActions[action]); } catch (e) {}
  });
  videoEl.addEventListener('play', () => { navigator.mediaSession.playbackState = 'playing'; });
  videoEl.addEventListener('pause', () => { navigator.mediaSession.playbackState = 'paused'; });
}

/* ---------- Nửa bên phải: xem video hoặc xem danh sách ---------- */
let listOpen = false;
let npInfoTimer = null;

function renderRightPane() {
  const hasVideo = nowPlayingEl.classList.contains('show');
  const app = document.getElementById('app');
  app.classList.toggle('video-view', hasVideo && !listOpen);
  app.classList.toggle('list-view', hasVideo && listOpen);
  videoEl.controls = !listOpen;
  document.getElementById('btn-list').textContent = listOpen ? '🎬 Video' : '☰ Danh sách';
}
function setListOpen(open) {
  listOpen = open;
  renderRightPane();
}
function showNowPlayingInfo() {
  nowPlayingEl.classList.add('info');
  clearTimeout(npInfoTimer);
  npInfoTimer = setTimeout(function () { nowPlayingEl.classList.remove('info'); }, NP_INFO_MS);
}
nowPlayingEl.addEventListener('pointermove', showNowPlayingInfo);
nowPlayingEl.addEventListener('pointerdown', showNowPlayingInfo);
nowPlayingEl.addEventListener('click', function () { if (listOpen) setListOpen(false); });
document.getElementById('btn-list').addEventListener('click', function () { setListOpen(!listOpen); });
document.getElementById('btn-scroll-up').addEventListener('click', function () {
  resultsEl.scrollBy({ top: -resultsEl.clientHeight * 0.8, behavior: 'smooth' });
});
document.getElementById('btn-scroll-down').addEventListener('click', function () {
  resultsEl.scrollBy({ top: resultsEl.clientHeight * 0.8, behavior: 'smooth' });
});

function markPlaying(videoId) {
  document.querySelectorAll('.song').forEach(el => {
    el.classList.toggle('playing', el.dataset.videoId === videoId);
  });
}

// Tự động phát video kế tiếp + lưu trạng thái
videoEl.addEventListener('ended', () => {
  saveState();
  changeTrack(1);
});
videoEl.addEventListener('timeupdate', function () {
  const now = Date.now();
  if (currentVideoId && now - lastTimeSave > 2000) {
    lastTimeSave = now;
    saveState();
  }
});
videoEl.addEventListener('pause', saveState);

document.getElementById('btn-prev').addEventListener('click', () => changeTrack(-1));
document.getElementById('btn-next').addEventListener('click', () => changeTrack(1));
document.getElementById('btn-playpause').addEventListener('click', () => {
  if (videoEl.paused) videoEl.play().catch(function () {});
  else videoEl.pause();
});

// Phóng to / thu nhỏ (bản đồ full màn hình, video phóng to trong nửa bên phải)
function setFocus(pane) {
  const app = document.getElementById('app');
  const isMap = (pane === 'map');
  const isVideo = (pane === 'video');
  app.classList.toggle('focus-map', isMap);
  app.classList.toggle('video-focus', isVideo);
  if (isVideo) setListOpen(false);
  const bm = document.getElementById('btn-expand-map');
  const bv = document.getElementById('btn-expand-music');
  bm.textContent = isMap ? '✕' : '⛶';
  bm.title = isMap ? 'Thu nhỏ' : 'Phóng to bản đồ';
  bv.textContent = isVideo ? '✕ Thu nhỏ' : '⛶ Phóng to';
  bv.title = isVideo ? 'Thu nhỏ' : 'Phóng to video';
}
document.getElementById('btn-expand-map').addEventListener('click', function () {
  const app = document.getElementById('app');
  setFocus(app.classList.contains('focus-map') ? '' : 'map');
});
document.getElementById('btn-expand-music').addEventListener('click', function () {
  const app = document.getElementById('app');
  setFocus(app.classList.contains('video-focus') ? '' : 'video');
});

/* ---------- Lịch sử tìm kiếm ---------- */
const searchInput = document.getElementById('search-input');
const searchHistoryEl = document.getElementById('search-history');

// Trên iPhone, đưa con trỏ vào ô nhập có thể làm trang phóng to và lệch bố cục, nên đưa về như cũ.
function resetPageZoom() {
  const meta = document.getElementById('viewport-meta');
  const normal = meta.getAttribute('content');
  meta.setAttribute('content', 'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1');
  setTimeout(function () { meta.setAttribute('content', normal); }, 100);
  window.scrollTo(0, 0);
  document.documentElement.scrollLeft = 0;
  document.body.scrollLeft = 0;
}

function runSearch(q) {
  const recent = loadList(SEARCH_HISTORY_KEY).filter(x => x.toLowerCase() !== q.toLowerCase());
  saveList(SEARCH_HISTORY_KEY, [q].concat(recent).slice(0, SEARCH_HISTORY_MAX));
  searchInput.value = q;
  searchInput.blur();
  setListOpen(true);
  doSearch(q);
}
// Bỏ dấu để gõ "nhac" vẫn ra "Nhạc"
function plainText(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase();
}
// Tìm gần đây xếp trước, sau đó là các gợi ý có sẵn; đang gõ thì lọc theo chữ đã gõ
function renderSearchHistory(typed) {
  const seen = new Set();
  const items = loadList(SEARCH_HISTORY_KEY).concat(DEFAULT_SEARCHES).filter(x => {
    const key = x.toLowerCase();
    if (seen.has(key) || !plainText(x).includes(typed)) return false;
    seen.add(key);
    return true;
  });
  searchHistoryEl.innerHTML = '';
  items.forEach(q => {
    const b = document.createElement('button');
    b.textContent = '🕘 ' + q;
    b.addEventListener('click', () => runSearch(q));
    searchHistoryEl.appendChild(b);
  });
  searchHistoryEl.classList.toggle('show', items.length > 0);
}
searchInput.addEventListener('input', () => renderSearchHistory(plainText(searchInput.value.trim())));
searchInput.addEventListener('focus', () => {
  renderSearchHistory('');
  setTimeout(resetPageZoom, 300);   // đợi iPhone phóng to xong rồi mới đưa về
});
searchInput.addEventListener('blur', () => {
  searchHistoryEl.classList.remove('show');
  resetPageZoom();
});
// iPhone không tự bỏ con trỏ khỏi ô nhập khi chạm ra ngoài
document.addEventListener('pointerdown', (e) => {
  if (e.target !== searchInput && !searchHistoryEl.contains(e.target)) searchInput.blur();
});
// Giữ ô tìm không mất focus khi bấm vào lịch sử, nếu không danh sách đóng trước khi nhận được cú bấm
searchHistoryEl.addEventListener('pointerdown', e => e.preventDefault());
searchHistoryEl.addEventListener('mousedown', e => e.preventDefault());

document.getElementById('search-btn').addEventListener('click', () => {
  const q = searchInput.value.trim();
  if (q) runSearch(q);
  else searchInput.focus();
});
document.getElementById('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('search-btn').click();
});

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Lưu video đang xem để lần sau mở lại tiếp tục
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      videoId: currentVideoId,
      title: document.getElementById('np-title').textContent,
      author: document.getElementById('np-artist').textContent,
      thumb: document.getElementById('np-thumb').getAttribute('src') || '',
      time: videoEl.currentTime || 0
    }));
  } catch (e) {}
}

// Khôi phục video đang xem dở khi mở lại trang
function resumeLast() {
  let st = null;
  try { st = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) {}
  if (!st || !st.videoId) return;
  pendingResumeTime = st.time || 0;
  const item = {
    videoId: st.videoId,
    title: st.title || '',
    author: st.author || '',
    videoThumbnails: st.thumb ? [{ url: st.thumb }] : null
  };
  playSong(item);
}

/* ============================================================
   KHỞI ĐỘNG
   ============================================================ */
// Thêm ?debug vào địa chỉ để xem trang có bị trình duyệt phóng to hay không
if (location.search.includes('debug') && window.visualViewport) {
  const debugEl = document.createElement('div');
  debugEl.style.cssText = 'position:fixed;z-index:9999;left:50%;bottom:0;background:#000;color:#0f0;font-size:14px;padding:2px 6px;';
  document.body.appendChild(debugEl);
  setInterval(function () {
    const v = window.visualViewport;
    debugEl.textContent = innerWidth + '×' + innerHeight + ' vv ' + Math.round(v.width) + '×' + Math.round(v.height) +
      ' scale ' + v.scale.toFixed(2) + ' lech ' + Math.round(v.offsetLeft) + ',' + Math.round(v.offsetTop) + ' cuon ' + Math.round(scrollX);
  }, 500);
}

startGPS();
refreshInstances(); // lấy thêm máy chủ video dự phòng
resumeLast();       // tiếp tục video đang xem dở
doSearch('Nhạc Chill');   // tải sẵn vài video cho khỏi trống
</script>
